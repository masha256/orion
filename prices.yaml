# Token prices (Phase 3 R2, plan P1): one primary method and one check per token ref, read by the hourly price writer.
# Keyed by token ref: eip155:<chain id>/<address, lowercased>, solana:mainnet/<mint>, hyperliquid:spot/@<index>. Asset YAMLs
# never name methods: an asset uses the refs its price.token / price.token_check sources name, and the tokens its transfer
# flows scan (and their shares' underlyings), plus their quote refs, transitively; its config hash includes those entries
# (entriesFor, src/prices/config.ts).
#
# Fields:
#   chain       where the PRIMARY is read: eip155:1 | eip155:56 | eip155:8453 | solana | hyperliquid | lighter. LIT's ref is
#               its Ethereum address, but its primary is Lighter's candle, so its chain is `lighter`.
#   valid_from  the first hour Orion writes for this ref (00:00Z of that day); no row is written for an earlier hour.
#               Measured by the controller (Ruling R2): every EVM ref but AERO 2025-10-13 (all reads worked at the
#               2025-10-13T01:00Z block); AERO 2026-09-23; HYPE and LIT 2026-10-01; PUMP 2026-10-12.
#   primary     the method whose value is stored. check: a second method compared with it each hour; tolerance_pct is the
#               allowed gap, consecutive the hours in a row it must be exceeded before it is a breach (default 1).
#               A `bound` check has no tolerance: its band [min_in_quote, max_in_quote] is the tolerance.
#   quote_ref   a ref priced in this file that the method's price is multiplied by (it has no row for an hour, nor does this).
#   usd_feed / feed   a Chainlink feed (8 decimals, latestRoundData answer and updatedAt). Feeds are not token refs. A feed
#               is read on the chain of the ref's eip155 prefix; for the off-chain primaries (HYPE, LIT, PUMP) it is the
#               Ethereum USDC/USD feed, which the writer reads first each hour and hands on (Ruling R5).
#
# Hour semantics (plan P2): a row with ts = H is the bucket [H, H+1h), read at B(H+1h), the first block at or after H+1h.

