# cvxCRV (Convex): a liquid claim on veCRV locked permanently by Convex's VoterProxy, valued as staked in the
# CvxCrvStakingWrapper (stkcvxCRV) for all three of its reward streams (user, 2026-10-09: "All 3 streams for cvxcrv").
#
# Cash paths, read on chain 2026-10-09 (spec docs/superpowers/specs/2026-10-09-orion-lockers-onboarding-design.md):
#   crvUSD: Curve FeeDistributor -> VoterProxy -> Booster -> crvUSD reward pool (100 percent of Convex's fee share) ->
#     the wrapper, as stakers checkpoint. 91 days: 684,621 crvUSD into the pool, about 2.75M USD a year.
#   CRV: Booster -> cvxCRV BaseRewardPool (Convex's platform fee on the CRV its pools earn) -> the wrapper. About 6.6M
#     CRV a year: tied to CRV emissions and CRV's price.
#   CVX: CvxDistribution (a Convex treasury program, discretionary) -> the wrapper, plus a trickle of CVX minted on the
#     CRV rewards (CVX is at 99.994M of its 100M cap). About 0.4M CVX a year.
# No vote incentives: Convex's votes are paid through Votium to vlCVX, not to cvxCRV.
# Each stream is measured at the wrapper (its inflows from the funding contract), so the cash is per stkcvxCRV.
id: cvxcrv
symbol: cvxCRV
name: Convex CRV (staked in CvxCrvStakingWrapper)
chain: ethereum
supply_basis: effective_total

contracts:
  token: "0x62B9c7356A2Dc64a1969e19C23e4f579F9810Aa7" # cvxCRV
  wrapper: "0xaa0c3f5f7dfd688c6e646f66cd2a6b66acdbe434" # CvxCrvStakingWrapper (stkcvxCRV): totalSupply() is the cvxCRV staked
  crvusd: "0xf939E0A03FB07F59A73314E73794Be0E57ac1b4E"
  crv: "0xD533a949740bb3306d119CC777fa900bA034cd52"
  cvx: "0x4e3FBD56CD56c3e72c1403e103b45Db9da5B9D2B"
  crvusd_pool: "0x191f455cc8acdd579f4e6956fc7007c9668c2289" # Convex's crvUSD reward pool for cvxCRV stakers
  base_reward_pool: "0x3Fe65692bfCD0e6CF84cB1E7d24108E434A7587e" # cvxCRV BaseRewardPool: pays CRV
  cvx_distribution: "0x449f2fd99174e1785cf2a1c79e665fec3dd1ddc6" # CvxDistribution: the treasury's CVX program
  cvx_mint: "0x0000000000000000000000000000000000000000" # CVX minted on CRV rewards arrives from the zero address
  booster: "0xF403C135812408BFbE8713b5A23a04b3D48AAE31" # reference; not read
  voter_proxy: "0x989AEb4d175e16225E39E87d0D97A3360524AD80" # Convex's veCRV (reference; not read)
  cvx_reward_pool: "0xCF50b810E57Ac33B91dCF525C6ddd9881B139332" # cvxRewardPool: CVX stakers' 4.5 percent of the Booster's CRV
  convex_treasury: "0x1389388d01708118b497f59521f6943be2541bb7" # TreasuryFunds: the Booster's platformFee (2 percent)
  # Convex fee forwarders (owner: Convex multisig 0xa3c5a1e09150b75ff251c1a7815a07182c3de2fb). They send CRV (and FXS/CVX)
  # from Convex's other products to the treasury; not the Booster's Curve cut, so ignored on convex_rev_treasury.
  cvx_fee_fwd_1: "0x04dd97255ddee29c941d85f5b5cde6ace8bd207f"
  cvx_fee_fwd_2: "0x9d464b601f74c8d3d42379921106b907f1055f80"
  cvx_fee_fwd_3: "0xa25b17d7deee59f9e326e45cc3c0c1b158e74316"

ingest: { chain_id: 1, rpc_url_env: ORION_ETH_RPC_URL, backfill_days: 100 }

external_ids:
  coingecko: convex-crv
  defillama: convex-finance

metrics:
  price_usd:
    type: level
    unit: usd
    staleness_days: 3
    critical: true
    source: { type: coingecko, id: convex-crv, field: price }
    cross_checks:
      - { tolerance_pct: 2, source: { type: http_json, url: "https://coins.llama.fi/prices/current/ethereum:0x62B9c7356A2Dc64a1969e19C23e4f579F9810Aa7", path: "coins.ethereum:0x62B9c7356A2Dc64a1969e19C23e4f579F9810Aa7.price" } }

  effective_supply:
    type: level
    unit: tokens
    staleness_days: 7
    critical: true
    source: { type: erc20_supply, token: token }

  staked_supply:
    type: level
    unit: tokens
    staleness_days: 7
    critical: true
    source: { type: contract_read, contract: wrapper, function: totalSupply, decimals: 18 }

  staker_emission_share:
    type: level
    unit: ratio
    staleness_days: 7
    source: { type: constant, value: 0, note: "cvxCRV has no emissions of its own; stakers are paid in crvUSD, CRV and CVX, valued as holder flows" }

  emission_rate_annual:
    type: schedule
    unit: tokens_per_year
    staleness_days: 7
    critical: true
    source: { type: constant, value: 0, note: "cvxCRV is minted 1:1 against CRV locked by Convex; no emission schedule" }

  flow_usd.fees:
    type: flow
    unit: usd
    cadence: daily
    staleness_days: 10
    critical: true
    source: { type: transfer_flow, token: crvusd, to: wrapper, from_allowlist: [ crvusd_pool ], unit: usd, price_coingecko_id: crvusd }

  flow_usd.crv:
    type: flow
    unit: usd
    cadence: daily
    staleness_days: 10
    critical: true
    source: { type: transfer_flow, token: crv, to: wrapper, from_allowlist: [ base_reward_pool ], unit: usd, price_coingecko_id: curve-dao-token }

  flow_usd.cvx:
    type: flow
    unit: usd
    cadence: daily
    staleness_days: 10
    critical: true
    source: { type: transfer_flow, token: cvx, to: wrapper, from_allowlist: [ cvx_distribution, cvx_mint ], unit: usd, price_coingecko_id: convex-finance }

  # The three streams' last 91 days, summed day by day and scaled to a year: the cash cvxCRV stakers receive.
  revenue_run_rate_usd:
    type: level
    unit: usd
    staleness_days: 10
    critical: true
    source: { type: derived, name: flow_annualized, params: { metrics: [ flow_usd.fees, flow_usd.crv, flow_usd.cvx ], days: 91 } }

  # Report-only (monitor_only, never a driver). Convex's revenue is the cut its Booster keeps of the CRV it earns (getters
  # read 2026-10-10, out of 10000: lockIncentive 1000 to cvxCRV stakers, stakerIncentive 450 to CVX stakers, platformFee
  # 200 to the treasury; earmarkIncentive 50 goes to callers and is not revenue). Measured outflows match the getters to
  # four decimals. The gross is the CRV the VoterProxy sends the Booster (about 16.4M over 91 days).
  flow_usd.convex_gross_crv:
    type: flow
    unit: usd
    cadence: daily
    staleness_days: 10
    monitor_only: true
    source: { type: transfer_flow, token: crv, to: booster, from_allowlist: [ voter_proxy ], unit: usd, price_coingecko_id: curve-dao-token }
  flow_usd.convex_rev_cvxcrv:
    type: flow
    unit: usd
    cadence: daily
    staleness_days: 10
    monitor_only: true
    source: { type: transfer_flow, token: crv, to: base_reward_pool, from_allowlist: [ booster ], unit: usd, price_coingecko_id: curve-dao-token }
  flow_usd.convex_rev_cvx:
    type: flow
    unit: usd
    cadence: daily
    staleness_days: 10
    monitor_only: true
    source: { type: transfer_flow, token: crv, to: cvx_reward_pool, from_allowlist: [ booster ], unit: usd, price_coingecko_id: curve-dao-token }
  flow_usd.convex_rev_treasury:
    type: flow
    unit: usd
    cadence: daily
    staleness_days: 10
    monitor_only: true
    # from_ignore: the three Convex fee forwarders (contracts above): other Convex products' fees, not Curve revenue.
    source: { type: transfer_flow, token: crv, to: convex_treasury, from_allowlist: [ booster ], from_ignore: [ cvx_fee_fwd_1, cvx_fee_fwd_2, cvx_fee_fwd_3 ], unit: usd, price_coingecko_id: curve-dao-token }

holder_flows:
  # All three are paid only to stakers, so each is valued per staked token. CVX is a treasury program Convex can end,
  # so it is discretionary: its own discount premium and capture path carry its wind-down.
  - { id: fees, kind: fee_share, capture_rule: programmatic, recipient_base: staked, valued_per: recipients, metric: flow_usd.fees, window_days: 91 }
  - { id: crv, kind: fee_share, capture_rule: programmatic, recipient_base: staked, valued_per: recipients, metric: flow_usd.crv, window_days: 91 }
  - { id: cvx, kind: fee_share, capture_rule: discretionary, recipient_base: staked, valued_per: recipients, metric: flow_usd.cvx, window_days: 91 }

modules:
  - { id: hc, type: holder_cashflow, kind: estimate, weight: 0.6 }
  - { id: fm_holder_flow, type: forward_multiple, kind: estimate, weight: 0.4, params: { basis: holder_flow } }

scenario_probabilities: { bear: 0.25, base: 0.5, bull: 0.25 }

# Agent bands (2026-10-09), yCRV's (calibration/ycrv-assumptions.yaml carries the same growth, discount, multiple and regime
# values; the mirror rule as for CRV). Capture is each flow's share of the summed run rate, so each capture key is held to
# a band around its calibrated share (wide enough for the mix to drift, narrow enough that the shares cannot sum to much
# over 1 and count the run rate twice). Ramps 0 to 4 years. Staked ratio: min/max (valued_per recipients uses today's
# staked share, so it does not move the value). Recalibrate the bands whenever the calibrated values move.
assumptions:
  rev_growth_y1: { min: -0.6, max: 2, bear: { min: -0.32, max: -0.18 }, base: { min: -0.18, max: -0.03 }, bull: { min: 0.01, max: 0.09 } }
  growth_fade_years: { min: 1, max: 8 }
  terminal_growth: { min: -0.2, max: 0.05, bear: { min: -0.095, max: -0.065 }, base: { min: -0.065, max: -0.035 }, bull: { min: -0.035, max: -0.005 } }
  capture_rate_terminal.fees: { min: 0.4, max: 0.62 }
  capture_ramp_years.fees: { min: 0, max: 4 }
  capture_rate_terminal.crv: { min: 0.26, max: 0.46 }
  capture_ramp_years.crv: { min: 0, max: 4 }
  # CVX stopped in September 2026: 0 unless Convex restarts the program (then up to about its old share, 0.13).
  capture_rate_terminal.cvx: { min: 0, max: 0.15 }
  capture_ramp_years.cvx: { min: 0, max: 4 }
  discount_rate_base: { min: 0.08, max: 0.35, bear: { min: 0.225, max: 0.275 }, base: { min: 0.18, max: 0.225 }, bull: { min: 0.14, max: 0.18 } }
  discount_premium_programmatic: { min: 0, max: 0.15, bear: { min: 0.025, max: 0.035 }, base: { min: 0.015, max: 0.025 }, bull: { min: 0.005, max: 0.015 } }
  discount_premium_discretionary: { min: 0, max: 0.3, bear: { min: 0.11, max: 0.13 }, base: { min: 0.09, max: 0.11 }, bull: { min: 0.07, max: 0.09 } }
  multiple.fm_holder_flow: { min: 3, max: 60, bear: { min: 3.5, max: 6.5 }, base: { min: 6.5, max: 9.5 }, bull: { min: 9.5, max: 12.5 } }
  regime_multiplier: { min: 0.4, max: 1.6, bear: { min: 0.7, max: 0.9 }, base: { min: 0.9, max: 1.1 }, bull: { min: 1.1, max: 1.3 } }
  staked_ratio_horizon: { min: 0.5, max: 1 }

agent:
  budgets:
    weekly: { input_tokens: 2000000 }

review_triggers:
  driver_deviation_pct: 25
  provisional_move_pct: 25
  calendar:
    - { date: "2027-08-12", note: "CRV emission rate cut (97.2M to 81.7M CRV a year): the CRV stream tracks emissions" }

peer_set: []

# Report-only holder yield and growth (orion report yield). Haircuts from pool depth (2026-10-10): crvUSD none; CRV 1
# percent (a day's CRV, about $5K, moves the TriCRV pool 0.6 percent; a week's 4.4); CVX 0.5 (the CVX/ETH pool is deep).
reporting:
  window_days: 91
  haircuts: { fees: 0, crv: 0.01, cvx: 0.005 }
  # Protocol revenue = what Convex keeps: the CVX stakers' 4.5 percent and the treasury's 2 (Mike, 2026-10-11). The 10 percent
  # lock incentive (convex_rev_cvxcrv) goes to cvxCRV stakers, i.e. holder cash, so it is recorded but not counted here.
  revenue: [ flow_usd.convex_rev_cvx, flow_usd.convex_rev_treasury ]
  volume: [ flow_usd.convex_gross_crv ]
