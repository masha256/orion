    source: { type: adapter, name: pool.vrm_incentives_daily, params: { class: protocol_subsidy, since: "2026-10-22", scan: *aero_scan } }

# Income statement v2 (spec 2026-10-28 §6/§8; Phase 3 R4 spec section 5): revenue = every pool fee users pay, on chain
# since the launch. The LP share is the cost of revenue; sAERO allocators get the rest (contractual, paid in the pools'
# own tokens, many long-tail: 2 percent haircut). Incentives are below the line: third-party vote incentives to holders
# (3 percent, CRV's figure), Aero's own programs shown but left out of holder flow. Pre-merger Aerodrome is not rebuilt,
# so the window reads "N of 91 days" and growth is not meaningful until a full prior window exists.
income_statement:
  category: dex
  scope: complete
  window_days: 91
  history_start: "2026-10-22"
  revenue:
    - { id: voter_rev, label: "pool fees to sAERO allocators (gauged pools, 8 chains)", metric: flow_usd.voter_fees, started: "2026-10-22" }
    - { id: lp_rev, label: "pool fees kept by LPs (unstaked, ungauged and Aero Lite pools)", metric: flow_usd.lp_fees, started: "2026-10-22" }
  cost_of_revenue:
    - { id: lp_fees, to: lps, of: lp_rev }
  holders:
    - { id: voter_fees, of: voter_rev, bucket: cash, haircut: 0.02, recipient_base: locked, capture_rule: contractual }
  below_line:
    - { id: vote_incentives, metric: flow_usd.vote_incentives, to: holders, bucket: cash, haircut: 0.03, recipient_base: locked, capture_rule: programmatic, started: "2026-10-22" }
    - { id: protocol_subsidy, metric: flow_usd.protocol_subsidy, to: holders, in_holder_flow: false, note: "Aero Foundation TGE wallet and governance multisig programs: Aero's own money recycled", started: "2026-10-22" }
  dilution:
    - { id: aero_upgrade, metric: upgrade_release_aero, cap_metric: upgrade_reserve_aero, note: "unclaimed Aerodrome upgrade reserve moving to holders (trailing 30 days, capped at what is left)" }
    - { id: velo_upgrade, metric: upgrade_release_velo, cap_metric: upgrade_reserve_velo, note: "unclaimed Velodrome upgrade reserve moving to holders (trailing 30 days, capped at what is left)" }
