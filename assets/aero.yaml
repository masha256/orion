                - { token: "0x833589fcd6edb6e08f4c7c32d4f71b54bda02913", feed: "0x7e860098F58bBFC8648a4311b374B1D669a2bc6B", description: "USDC / USD" } # USDC: anchors-chainlink.json tier A
                - { token: "0x4200000000000000000000000000000000000006", feed: "0x50015f8b17fb2C290Dde41fDc246ed0dcEE93a8b", description: "ETH / USD" } # WETH: anchors-chainlink.json tier A
