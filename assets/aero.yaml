              factory_registry: "0x7b2a2c12dc5ea2a31455952a05031c3e4bb28f3e" # discovery.json; incentives-and-events.md table
              leaf_voter: "0x382409fad8503FbCdbB27A4211551fa03e884078" # LeafVoter: onchain-revenue.md section 10
              anchors:
