    type: flow
    unit: usd
    cadence: daily
    staleness_days: 3
    monitor_only: true
    source: { type: adapter, name: pool.tape_fees_daily, params: { field: gross, since: "2026-10-22", scan: *aero_scan } }

  # VRM incentive programs streamed to allocators: third parties and the Foundation-signer Safe (vote_incentives), and the
