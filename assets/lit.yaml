id: lit
symbol: LIT
name: Lighter
chain: ethereum
supply_basis: effective_total

# Read live on 2026-10-16; see docs/superpowers/notes/2026-10-16-lit-onboarding.md.
# The fee route: Lighter's treasury account (L2 account 0, also the fee account) buys LIT on its own LIT/USDC spot market
# (2049) every day. The bought LIT is withdrawn to an L1 wallet that pays the staking rewards; each quarter an equal count
# is burned from the ecosystem reserve to dead (2026-07-10 15.64M = everything bought to Q2; 2026-10-09 2.45M = Q3). On a
# total-supply basis that is one buyback-and-burn: the buys are the holder flow, counted once.
contracts:
  token: "0x232CE3bd40fCd6f80f3d55A522d03f25Df784Ee2" # LIT (ERC-20, 1B minted); burns go to dead
  dead: "0x000000000000000000000000000000000000dEaD" # 18.09M LIT on 2026-10-16: the two quarterly burns
  burn_safe: "0x3dd7c834eaa70c98e1c224808a3c62163b344dae" # Safe (2 of 3): sends each quarter's burn from the reserve to dead
  ecosystem_reserve: "0xe554dcb002e4f3546d67e6deed84323eed989d62" # 231.8M LIT on 2026-10-16: the burns are drawn from here
  buyback_wallet: "0x1a51016fad47de690d1f48adf2f6407f3cdc160d" # the bought LIT, withdrawn from the L2; funds staking rewards

ingest: { chain_id: 1, rpc_url_env: ORION_ETH_RPC_URL, backfill_days: 100 }

external_ids:
  coingecko: lighter
  defillama: lighter

# Every metric is fetched: no manual metric, so a bootstrap run finds nothing to research and writes only its journal.
# Lighter's own API for the buybacks and a price check (Mike, 2026-10-16); DefiLlama only for the gross fees and revenue
# (fees accrue inside the L2, no on-chain source) and the unlock schedule (no vesting contract on chain).
metrics:
  price_usd:
    type: level
    unit: usd
    staleness_days: 3
    critical: true
    source: { type: coingecko, id: lighter, field: price }
    cross_checks:
      - { tolerance_pct: 2, source: { type: http_json, url: "https://mainnet.zklighter.elliot.ai/api/v1/orderBookDetails?market_id=2049", path: spot_order_book_details.0.last_trade_price } }

  # 1B less dead: 981.91M on 2026-10-16. The team, investor and ecosystem allocations stay inside (effective_total, the same
  # basis as every Orion asset): they are already minted and can be sold. CoinGecko's total (1B) has not netted the burns,
  # so the cross-check is 2.5 percent (1.8 percent apart on 2026-10-16; it widens by each quarter's burn).
  total_supply:
    type: level
    unit: tokens
    staleness_days: 7
    critical: true
    source: { type: erc20_supply, token: token, subtract_balances: [ dead ] }
    cross_checks:
      - { tolerance_pct: 2.5, source: { type: coingecko, id: lighter, field: total_supply } }

  # CoinGecko's own definition (250M on 2026-10-16: the airdrop); informational under effective_total, the report's market cap.
  circulating_supply:
    type: level
    unit: tokens
    staleness_days: 14
    source: { type: coingecko, id: lighter, field: circulating_supply }

  # LIT staking pays rewards in bought LIT (redistribution), not a fee share the model values: the burn reaches every holder.
  staked_supply:
    type: level
    unit: tokens
    staleness_days: 7
    source: { type: constant, value: 0, note: "staking rewards are bought LIT passed on, not a fee share; the burn reaches every holder" }

  staker_emission_share:
    type: level
    unit: ratio
    staleness_days: 7
    source: { type: constant, value: 0, note: "no emissions" }

  # No minting: all 1B were minted at launch. The unlocks are tokens already in total supply, so they are reported as
  # dilution (reporting.dilution), never counted as an emission.
  emission_rate_annual:
    type: schedule
    unit: tokens_per_year
    staleness_days: 45
    critical: true
    source: { type: constant, value: 0, note: "1B minted at launch; unlocks move tokens already in total supply" }

  # The holder flow: USDC the treasury account spends on LIT each completed UTC day, read from Lighter's trades (account 0
  # the bid on market 2049). Matches DefiLlama's holders revenue to the dollar for June to September 2026. The API keeps
  # about 150 days of trades, so history starts 2026-05-24 (Mike, 2026-10-16: no DefiLlama stitch before it).
  flow_usd.buyback:
    type: flow
    unit: usd
    cadence: daily
    staleness_days: 4
    critical: true
    source: { type: adapter, name: lit.treasury_buys_daily, params: { account: 0, market: 2049, unit: usd, days: 7 } }
    cross_checks:
      - { tolerance_pct: 5, source: { type: defillama, slug: lighter, data_type: dailyHoldersRevenue, compare: monthly_sum } }

  # The same buys in LIT: the tokens the quarterly burn removes.
  flow_tokens.buyback:
    type: flow
    unit: tokens
    cadence: daily
    staleness_days: 4
    monitor_only: true
    source: { type: adapter, name: lit.treasury_buys_daily, params: { account: 0, market: 2049, unit: tokens, days: 7 } }

  # Report-only: the quarterly burns as executed, reserve LIT to dead from the Safe. Any other sender raises an unlisted
  # anomaly. The supply falls by these; the buys above are the flow, so this is the check that the count matches.
  flow_tokens.burn:
    type: flow
    unit: tokens
    cadence: daily
    staleness_days: 120
    monitor_only: true
    source: { type: transfer_flow, token: token, to: dead, from_allowlist: [ burn_safe ], unit: tokens }

  # The last 91 days of buys, scaled to a year (Mike, 2026-10-16: window 91).
  revenue_run_rate_usd:
    type: level
    unit: usd
    staleness_days: 4
    critical: true
    source: { type: derived, name: flow_annualized, params: { metric: flow_usd.buyback, days: 91 } }

  # Report-only: team and investor tokens unlocking over the next 365 days (linear from 2026-12-29 over three years,
  # 1.661M + 1.533M LIT a week). DefiLlama's emissions dataset, the asset-specific series with no on-chain source.
  unlocks_next_year: { type: level, unit: tokens_per_year, staleness_days: 14, monitor_only: true, source: { type: adapter, name: lit.unlocks_next_year, params: { allocations: [ Team, Investors ] } } }
  reserve_lit: { type: level, unit: tokens, staleness_days: 7, monitor_only: true, source: { type: contract_read, contract: token, function: balanceOf, args: [ ecosystem_reserve ], decimals: 18 } }

  # Display only: DefiLlama's gross fees and its revenue (Lighter perps, spot and Robinhood perps).
  flow_usd.fees:
    type: flow
    unit: usd
    cadence: daily
    staleness_days: 5
    monitor_only: true
    source: { type: defillama, slug: lighter, data_type: dailyFees, backfill_days: 150 }
  flow_usd.llama_revenue:
    type: flow
    unit: usd
    cadence: daily
    staleness_days: 5
    monitor_only: true
    source: { type: defillama, slug: lighter, data_type: dailyRevenue, backfill_days: 150 }

# discretionary (Mike, 2026-10-16): the burn policy dates from June 2026, the team executes each burn, and the burned LIT
# is drawn from the reserve rather than being the bought LIT.
holder_flows:
  - { id: buyback, kind: burn, capture_rule: discretionary, recipient_base: all, metric: flow_usd.buyback, window_days: 91 }

# UNI's and CAKE's shape: the discounted flow carries most of the weight, the market's multiple on it the rest.
# Structural: the agent may only propose.
modules:
  - { id: hc, type: holder_cashflow, kind: estimate, weight: 0.6 }
  - { id: fm_holder_flow, type: forward_multiple, kind: estimate, weight: 0.4, params: { basis: holder_flow } }

scenario_probabilities: { bear: 0.25, base: 0.5, bull: 0.25 }

# Key-wide bounds only until calibration (checkpoint 3) sets the agent bands.
assumptions:
  rev_growth_y1: { min: -0.6, max: 3.0 }
  growth_fade_years: { min: 1, max: 10 }
  terminal_growth: { min: 0, max: 0.05 }
  capture_rate_terminal.buyback: { min: 0.3, max: 1.0 }
  capture_ramp_years.buyback: { min: 0, max: 4 }
  discount_rate_base: { min: 0.08, max: 0.35 }
  discount_premium_discretionary: { min: 0, max: 0.15 }
  multiple.fm_holder_flow: { min: 3, max: 200 }
  regime_multiplier: { min: 0.4, max: 1.6 }
  staked_ratio_horizon: { min: 0.01, max: 1 }

agent:
  budgets:
    weekly: { input_tokens: 2000000 }

review_triggers:
  driver_deviation_pct: 25
  provisional_move_pct: 25

peer_set: []

# Report-only holder yield and growth. A burn: no haircut. Revenue = DefiLlama's revenue (a labelled proxy: fees accrue
# inside the L2); paid to holders = the buys. The unlocks are the dilution, the buys in LIT the tokens removed.
reporting:
  window_days: 91
  haircuts: { buyback: 0 }
  revenue:
    - { id: trading, label: "trading fees kept (DefiLlama dailyRevenue)", metric: flow_usd.llama_revenue, settlement: daily }
  income:
    lines:
      - { id: buyback, to: holders, metric: flow_usd.buyback, note: "treasury buys LIT daily; an equal count is burned quarterly" }
  volume: [ flow_usd.fees ]
  burned_tokens: [ flow_tokens.buyback ]
  dilution:
    - { id: unlocks, metric: unlocks_next_year, note: "team and investor vesting from 2026-12-29 (DefiLlama emissions)" }
