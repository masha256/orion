# sdCRV (StakeDAO): a liquid claim on veCRV locked permanently by StakeDAO's locker, valued as staked in the sdCRV
# gauge for its three reward streams, vote incentives included (user, 2026-10-09: "Yes count sdcrv bribes").
#
# Cash paths, read on chain 2026-10-09 (spec docs/superpowers/specs/2026-10-09-orion-lockers-onboarding-design.md):
#   crvUSD: Curve FeeDistributor -> StakeDAO locker -> CurveAccumulator, which splits it 85 percent to the sdCRV gauge,
#     10 percent to a liquidity fee recipient and 5 percent to the treasury. 91 days: 164,457 crvUSD to the gauge.
#   CRV: FeeReceiver (StakeDAO's fee on the CRV its strategies earn) -> CurveAccumulator -> gauge (66 percent; the rest
#     to veBoost delegation). 189,832 CRV in 91 days.
#   Vote incentives: Botmarket sells the bribes paid for sdCRV's votes into sdCRV and funds a MultiMerkleStash weekly
#     (2,452,748 sdCRV in 91 days, about 1.8M USD a year, about 66 percent of the cash). Claimants are sdCRV gauge
#     stakers (the top claimants hold their sdCRV in the gauge), so the bribes go to the same base as the fees.
# The gauge lists SDT as a reward, but SDT's gauge weight is 0: no SDT was paid in 91 days, so it is left out.
id: sdcrv
symbol: sdCRV
name: StakeDAO CRV (staked in the sdCRV gauge)
chain: ethereum
supply_basis: effective_total

contracts:
  token: "0xD1b5651E55D4CeeD36251c61c50C889B36F6abB5" # sdCRV
  gauge: "0x7f50786a0b15723d741727882ee99a0bf34e3466" # Stake DAO sdCRV Gauge: totalSupply() is the sdCRV staked
  crvusd: "0xf939E0A03FB07F59A73314E73794Be0E57ac1b4E"
  crv: "0xD533a949740bb3306d119CC777fa900bA034cd52"
  accumulator: "0x11f78501e6b0cbc5de4c7e6bbabaacdb973eb4cd" # CurveAccumulator: funds the gauge with crvUSD and CRV
  merkle_stash: "0x03e34b085c52985f6a5d27243f20c84bddc01db4" # MultiMerkleStash: stakers claim the vote incentives here
  botmarket: "0xadfbfd06633eb92fc9b58b3152fe92b0a24eb1ff" # Botmarket: sells bribe tokens into sdCRV, funds the stash
  locker: "0x52f541764E6e90eeBc5c21Ff570De0e2D63766B6" # StakeDAO's veCRV (reference; not read)
  sd_accountant: "0x93b4b9bd266ffa8af68e39edfa8cfe2a62011ce0" # Accountant: takes getProtocolFeePercent (16.5 percent) of strategy CRV
  sd_staking_v2_fee: "0x239fe53f10fe77e9c6ed896e3ae4ab8e43eed082" # StakingV2FeeRecipient: older strategies' fee
  sd_fee_receiver: "0x60136fefe23d269af41ab72de483d186dc4318d6" # FeeReceiver: splits the fee to veSDT, treasury, and sdCRV (accumulator)
  sd_liquidity_fee: "0x576d7ad8eae92d9a972104aac56c15255ddbe080" # LiquidityFeeRecipient: 10 percent of the crvUSD fees
  sd_vesdt_recipient: "0x1fe537bd59a221854a53a5b7a81585b572787fce" # VeSDTRecipient: veSDT holders' share of the CRV fee
  sd_treasury: "0x9ebbb3d59d53d6ad3fa5464f36c2e84abb7cf5c1" # TreasuryRecipient: 5 percent of the crvUSD fees (and part of the CRV fee)
  # StakeDAO strategy sidecar implementations: ~90 EIP-1167 clones of these send their pools' CRV to the Accountant. They are
  # strategy CRV the Accountant fees on, not the locker's own CRV (gross volume is the locker's; Accountant->FeeReceiver is
  # 16.6 percent of the locker's CRV alone), so their clones are ignored on sd_gross_crv.
  sd_sidecar_impl_a: "0xef7cffdef21538b63cc541bf206bb382d922a216"
  sd_sidecar_impl_b: "0x66c3ce4718a39d44ce2430eb3e8b8d43c18ba1fa"
  sd_boost_delegation: "0xe1f9c8ebbc80a013caf0940fdd1a8554d763b9cf" # VeBoostDelegationMultiRewards: boost delegators' CRV

ingest: { chain_id: 1, rpc_url_env: ORION_ETH_RPC_URL, backfill_days: 100 }

external_ids:
  coingecko: stake-dao-crv
  defillama: stakedao

metrics:
  # CoinGecko's sdCRV quote is thinner than cvxCRV's: it ran +2 to +6 percent over DefiLlama (which tracks the
  # sdCRV/CRV Curve pool) on 2026-10-03..09, +16 percent on 10-08; median -0.3 percent over 90 days. 5 percent lets the
  # usual spread through and still flags a day like 10-08.
  price_usd:
    type: level
    unit: usd
    staleness_days: 3
    critical: true
    source: { type: coingecko, id: stake-dao-crv, field: price }
    cross_checks:
      - { tolerance_pct: 5, source: { type: http_json, url: "https://coins.llama.fi/prices/current/ethereum:0xD1b5651E55D4CeeD36251c61c50C889B36F6abB5", path: "coins.ethereum:0xD1b5651E55D4CeeD36251c61c50C889B36F6abB5.price" } }

  total_supply:
    type: level
    unit: tokens
    staleness_days: 7
    critical: true
    source: { type: erc20_supply, token: token }

  # CoinGecko has no circulating supply for this wrapper (Mike, 2026-10-12): every token is in circulation, so it is
  # the on-chain total. Display basis for market cap; never a valuation input (supply_basis stays effective_total).
  circulating_supply:
    type: level
    unit: tokens
    staleness_days: 14
    source: { type: erc20_supply, token: token }

  staked_supply:
    type: level
    unit: tokens
    staleness_days: 7
    critical: true
    source: { type: contract_read, contract: gauge, function: totalSupply, decimals: 18 }

  staker_emission_share:
    type: level
    unit: ratio
    staleness_days: 7
    source: { type: constant, value: 0, note: "sdCRV has no emissions of its own (the gauge's SDT weight is 0); stakers are paid in crvUSD, CRV and sdCRV bribes" }

  emission_rate_annual:
    type: schedule
    unit: tokens_per_year
    staleness_days: 7
    critical: true
    source: { type: constant, value: 0, note: "sdCRV is minted 1:1 against CRV locked by StakeDAO; no emission schedule" }

  flow_usd.fees:
    type: flow
    unit: usd
    cadence: daily
    staleness_days: 10
    critical: true
    source: { type: transfer_flow, token: crvusd, to: gauge, from_allowlist: [ accumulator ], unit: usd, price_coingecko_id: crvusd }

  flow_usd.crv:
    type: flow
    unit: usd
    cadence: daily
    staleness_days: 10
    critical: true
    source: { type: transfer_flow, token: crv, to: gauge, from_allowlist: [ accumulator ], unit: usd, price_coingecko_id: curve-dao-token }

  # Bribes arrive as sdCRV: priced at sdCRV's own price (a fall in sdCRV lowers this stream as well as the spot).
  flow_usd.bribes:
    type: flow
    unit: usd
    cadence: daily
    staleness_days: 10
    critical: true
    source: { type: transfer_flow, token: token, to: merkle_stash, from_allowlist: [ botmarket ], unit: usd, price_coingecko_id: stake-dao-crv }

  revenue_run_rate_usd:
    type: level
    unit: usd
    staleness_days: 10
    critical: true
    source: { type: derived, name: flow_annualized, params: { metrics: [ flow_usd.fees, flow_usd.crv, flow_usd.bribes ], days: 91 } }

  # Report-only (monitor_only, never a driver). StakeDAO's revenue: the 16.5 percent its Accountant keeps of strategy CRV
  # (sent on to the FeeReceiver, which splits it about evenly between veSDT, the treasury and sdCRV), plus the 15 percent
  # of Curve's crvUSD fees the accumulator keeps (10 liquidity, 5 treasury). The gross is the CRV the locker passes to
  # the Accountant (about 5.4M over 91 days).
  flow_usd.sd_gross_crv:
    type: flow
    unit: usd
    cadence: daily
    staleness_days: 10
    monitor_only: true
    # from_ignore_clones_of: the sidecar clones (implementations above): other strategies' CRV, not the locker's.
    source: { type: transfer_flow, token: crv, to: sd_accountant, from_allowlist: [ locker ], from_ignore_clones_of: [ sd_sidecar_impl_a, sd_sidecar_impl_b ], unit: usd, price_coingecko_id: curve-dao-token }
  flow_usd.sd_rev_crv:
    type: flow
    unit: usd
    cadence: daily
    staleness_days: 10
    monitor_only: true
    source: { type: transfer_flow, token: crv, to: sd_fee_receiver, from_allowlist: [ sd_accountant, sd_staking_v2_fee ], unit: usd, price_coingecko_id: curve-dao-token }
  # The FeeReceiver splits the CRV fee three ways (91 days to 2026-10-11: veSDT 36, treasury 33, sdCRV accumulator 30
  # percent). The accumulator's part reaches sdCRV stakers (and boost delegators), so only veSDT and the treasury are
  # StakeDAO's protocol revenue (Mike, 2026-10-11). sd_rev_crv above is the whole fee, kept as a record.
  flow_usd.sd_rev_crv_vesdt:
    type: flow
    unit: usd
    cadence: daily
    staleness_days: 10
    monitor_only: true
    source: { type: transfer_flow, token: crv, to: sd_vesdt_recipient, from_allowlist: [ sd_fee_receiver ], unit: usd, price_coingecko_id: curve-dao-token }
  flow_usd.sd_rev_crv_treasury:
    type: flow
    unit: usd
    cadence: daily
    staleness_days: 10
    monitor_only: true
    source: { type: transfer_flow, token: crv, to: sd_treasury, from_allowlist: [ sd_fee_receiver ], unit: usd, price_coingecko_id: curve-dao-token }
  # The accumulator passes part of its CRV fee to veCRV boost delegators (VeBoostDelegationMultiRewards): a cost.
  flow_usd.sd_boost_delegation:
    type: flow
    unit: usd
    cadence: daily
    staleness_days: 10
    monitor_only: true
    source: { type: transfer_flow, token: crv, to: sd_boost_delegation, from_allowlist: [ accumulator ], unit: usd, price_coingecko_id: curve-dao-token }
  flow_usd.sd_rev_fees_liquidity:
    type: flow
    unit: usd
    cadence: daily
    staleness_days: 10
    monitor_only: true
    source: { type: transfer_flow, token: crvusd, to: sd_liquidity_fee, from_allowlist: [ accumulator ], unit: usd, price_coingecko_id: crvusd }
  flow_usd.sd_rev_fees_treasury:
    type: flow
    unit: usd
    cadence: daily
    staleness_days: 10
    monitor_only: true
    source: { type: transfer_flow, token: crvusd, to: sd_treasury, from_allowlist: [ accumulator ], unit: usd, price_coingecko_id: crvusd }

holder_flows:
  - { id: fees, kind: fee_share, capture_rule: programmatic, recipient_base: staked, valued_per: recipients, metric: flow_usd.fees, window_days: 91 }
  - { id: crv, kind: fee_share, capture_rule: programmatic, recipient_base: staked, valued_per: recipients, metric: flow_usd.crv, window_days: 91 }
  - { id: bribes, kind: fee_share, capture_rule: programmatic, recipient_base: staked, valued_per: recipients, metric: flow_usd.bribes, window_days: 91 }

modules:
  - { id: hc, type: holder_cashflow, kind: estimate, weight: 0.6 }
  - { id: fm_holder_flow, type: forward_multiple, kind: estimate, weight: 0.4, params: { basis: holder_flow } }

scenario_probabilities: { bear: 0.25, base: 0.5, bull: 0.25 }

# Agent bands (2026-10-09), yCRV's (calibration/ycrv-assumptions.yaml carries the same growth, discount, multiple and regime
# values; the mirror rule as for CRV). Capture is each flow's share of the summed run rate, so each capture key is held to
# a band around its calibrated share (wide enough for the mix to drift, narrow enough that the shares cannot sum to much
# over 1 and count the run rate twice). Ramps 0 to 4 years. Staked ratio: min/max (valued_per recipients uses today's
# staked share, so it does not move the value). Recalibrate the bands whenever the calibrated values move.
assumptions:
  rev_growth_y1: { min: -0.6, max: 2, bear: { min: -0.32, max: -0.18 }, base: { min: -0.18, max: -0.03 }, bull: { min: 0.01, max: 0.09 } }
  growth_fade_years: { min: 1, max: 8 }
  terminal_growth: { min: -0.2, max: 0.05, bear: { min: -0.095, max: -0.065 }, base: { min: -0.065, max: -0.035 }, bull: { min: -0.035, max: -0.005 } }
  capture_rate_terminal.fees: { min: 0.18, max: 0.35 }
  capture_ramp_years.fees: { min: 0, max: 4 }
  capture_rate_terminal.crv: { min: 0.05, max: 0.13 }
  capture_ramp_years.crv: { min: 0, max: 4 }
  capture_rate_terminal.bribes: { min: 0.55, max: 0.74 }
  capture_ramp_years.bribes: { min: 0, max: 4 }
  discount_rate_base: { min: 0.08, max: 0.35, bear: { min: 0.225, max: 0.275 }, base: { min: 0.18, max: 0.225 }, bull: { min: 0.14, max: 0.18 } }
  discount_premium_programmatic: { min: 0, max: 0.15, bear: { min: 0.025, max: 0.035 }, base: { min: 0.015, max: 0.025 }, bull: { min: 0.005, max: 0.015 } }
  multiple.fm_holder_flow: { min: 3, max: 60, bear: { min: 3.5, max: 6.5 }, base: { min: 6.5, max: 9.5 }, bull: { min: 9.5, max: 12.5 } }
  regime_multiplier: { min: 0.4, max: 1.6, bear: { min: 0.7, max: 0.9 }, base: { min: 0.9, max: 1.1 }, bull: { min: 1.1, max: 1.3 } }
  staked_ratio_horizon: { min: 0.5, max: 1 }

agent:
  budgets:
    weekly: { input_tokens: 2000000 }

review_triggers:
  driver_deviation_pct: 25
  provisional_move_pct: 25
  calendar:
    - { date: "2027-08-12", note: "CRV emission rate cut (97.2M to 81.7M CRV a year): vote incentives, most of sdCRV's cash, track emissions" }

peer_set: []

# Report-only holder yield and growth (orion report yield). Haircuts from pool depth (2026-10-10): crvUSD none; CRV 0.5
# percent (about $600 a day); the vote incentives are paid in sdCRV itself, whose one real pool (sdCRV/CRV, $1.5M) loses
# 1.3 percent on a day's payout and 9 on a week's, plus 0.5 more selling the CRV: 5 percent.
reporting:
  window_days: 91
  haircuts: { fees: 0, crv: 0.005, bribes: 0.05 }
  volume: [ flow_usd.sd_gross_crv ]
  # Income statement (Mike, 2026-10-11). Revenue = what StakeDAO takes in on its veCRV: the veCRV crvUSD fees, its CRV fee
  # (16.5 percent of strategy CRV), and the vote incentives (sold into sdCRV). Paid to sdCRV stakers: 85 percent of the
  # crvUSD, the accumulator's part of the CRV fee, the incentives. Kept: veSDT and treasury parts of the CRV fee, 15 percent
  # of the crvUSD (the 10 percent liquidity part funds sdCRV pool incentives at StakeDAO's direction). Cost: boost delegators.
  income:
    lines:
      - { id: vecrv_fees, to: holders, metric: flow_usd.fees }
      - { id: crv_fee_share, to: holders, metric: flow_usd.crv }
      - { id: vote_incentives, to: holders, metric: flow_usd.bribes }
      - { id: vesdt, to: protocol, metric: flow_usd.sd_rev_crv_vesdt }
      - { id: treasury_crv, to: protocol, metric: flow_usd.sd_rev_crv_treasury }
      - { id: liquidity_fee, to: protocol, metric: flow_usd.sd_rev_fees_liquidity }
      - { id: treasury_fees, to: protocol, metric: flow_usd.sd_rev_fees_treasury }
      - { id: boost_delegators, to: cost, metric: flow_usd.sd_boost_delegation }
    checks:
      - { total: [ flow_usd.sd_rev_crv ], parts: [ vesdt, treasury_crv, crv_fee_share, boost_delegators ] }
