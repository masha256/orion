id: crv
symbol: CRV
name: Curve DAO Token
chain: ethereum

# Read live on 2026-10-08 (block 26,146,581); see docs/superpowers/specs/2026-10-08-orion-crv-onboarding-design.md section 2.
contracts:
  token: "0xD533a949740bb3306d119CC777fa900bA034cd52" # CRV; also the emission schedule (rate, start_epoch_time)
  ve: "0x5f3b5DfEb7B28CDbD7FAba78963EE202a494e2A2" # VotingEscrow: veCRV locks; supply() is the CRV locked; its CRV is not circulating (irrevocable locks up to 4 years, decision N1a; Curve circ contract "# veCRV")
  crvusd: "0xf939E0A03FB07F59A73314E73794Be0E57ac1b4E" # the FeeDistributor's token()
  fee_distributor: "0xD16d5eC345Dd86Fb63C6a9C43c517210F1027914" # CurveFeeDistribution: pays veCRV weekly in crvUSD
  fee_allocator: "0x22530d384cd9915e096ead2db7f82ee81f8eb468" # FeeAllocator: 90 percent to the distributor, 10 to the Treasury
  # The liquid lockers' veCRV holders (monitor-only lines below; read live 2026-10-09, all locked to 2030).
  locker_convex: "0x989AEb4d175e16225E39E87d0D97A3360524AD80" # Convex VoterProxy (cvxCRV)
  locker_stakedao: "0x52f541764E6e90eeBc5c21Ff570De0e2D63766B6" # StakeDAO CRV locker (sdCRV)
  locker_yearn: "0xF147b8125d2ef93FB6965Db97D6746952a133934" # Yearn CurveYCRVVoter (yCRV)
  hooker: "0x9a9df35cd8e88565694ca6ad5093c236c7f6f69d" # Hooker: sends every protocol fee (crvUSD) to the FeeAllocator
  curve_treasury: "0x6508ef65b0bd57eabd0f1d52685a70433b2d290b" # Curve Treasury: the FeeAllocator's 10 percent; not circulating (decision N1b; docs.curve.finance/developer/deployments "Ethereum, Core, treasury, 0x6508ef65...")
  # Not circulating (Phase 3 R3, decision N1b): the rest of Curve's own CRV Circulating Supply contract's list.
  circ_contract: "0x14139EB676342b6bC8E41E0d419969f23A49881e" # Curve's CRV Circulating Supply contract (the N5 check): resources.curve.finance/crv-token/faq "The on-chain contract (0x14139EB6...) which shows the circulating supply, net of locked or otherwise vested tokens"
  community_fund: "0xe3997288987E6297Ad550A69B31439504F513267" # Community Fund, the DAO reserve: docs.curve.finance/user/dao/community-fund-treasury "Community Fund is deployed on Ethereum at 0xe399..."; circ contract "# community fund"
  vest_prelp: "0x575CCD8e2D300e2377B43478339E364000318E2c" # VestingEscrow, pre-CRV LPs (vested 2021-08-13, unclaimed): Curve docs "pre-CRV Liquidity Providers 0x575c..."; circ contract "# LPs"
  minter: "0xd061D61a4d941c39E5453435B6345Dc261C2fcE0" # Minter (dust): circ contract "# token minter"; CRV sent to the token itself is "# crv token" there

ingest: { chain_id: 1, rpc_url_env: ORION_ETH_RPC_URL, backfill_days: 100 }

external_ids:
  coingecko: curve-dao-token
  defillama: curve-finance

# Every metric is fetched: CRV has no manual metric, so a bootstrap run finds nothing to research and writes only its journal.
metrics:
  price_usd:
    type: level
    unit: usd
    staleness_days: 3
    critical: true
    # CRV: the TriCRV EMA x crvUSD; check the CRV/USD feed (prices.yaml; Phase 3 R2: read live at the run, no
    # CoinGecko).
    # No fetch-time cross-check (R22): the check runs hourly in the price writer (ORION WATCH, never an anomaly).
    source: { type: adapter, name: price.token, params: { ref: "eip155:1/0xd533a949740bb3306d119cc777fa900ba034cd52" } }

  # No burn: the ERC-20 total is the total supply. Locked CRV stays inside it.
  total_supply:
    type: level
    unit: tokens
    staleness_days: 7
    critical: true
    source: { type: erc20_supply, token: token }

  # On chain (Phase 3 R3, decision N1b): total less the CRV in veCRV (irrevocable locks: not circulating, decision N1a),
  # the Community Fund, the unclaimed pre-CRV LP vest, CRV stuck in the token and the Minter (Curve's own
  # circulating_supply() list, reproduced to the wei), and less the Curve Treasury, which Curve's list does not exclude:
  # 1,582,336,065 on 2026-11-20. Unvested grant escrows stay in (0.28 percent, ending 2027-04). Display only, the
  # report's market cap basis (FDV uses total_supply).
  circulating_supply:
    type: level
    unit: tokens
    staleness_days: 14
    source:
      type: adapter
      name: chain.view_sum
      params:
        terms:
          - { contract: token, function: totalSupply }
          - { contract: token, function: balanceOf, args: [ ve ], sign: -1 }
          - { contract: token, function: balanceOf, args: [ community_fund ], sign: -1 }
          - { contract: token, function: balanceOf, args: [ vest_prelp ], sign: -1 }
          - { contract: token, function: balanceOf, args: [ token ], sign: -1 }
          - { contract: token, function: balanceOf, args: [ minter ], sign: -1 }
          - { contract: token, function: balanceOf, args: [ curve_treasury ], sign: -1 }

  # The N5 check (Phase 3 R3): Curve's own circulating_supply() and the gap of ours to it, in percent. Ours also excludes
  # the Curve Treasury, so the steady gap is about -0.36 percent (2026-11-20); outside [-1.5, 0.5] is an ORION WATCH (a
  # treasury move, or CRV parked where Curve's frozen list does not look). Both are read, and the watch checked, at the
  # nightly run only: the hourly read skips derived and unwatched monitor-only metrics.
  curve_circulating:
    type: level
    unit: tokens
    staleness_days: 3
    monitor_only: true
    source: { type: contract_read, contract: circ_contract, function: circulating_supply, decimals: 18 }
  circulating_gap_curve:
    type: level
    unit: pct
    staleness_days: 3
    monitor_only: true
    source: { type: derived, name: level_gap_pct, params: { a: circulating_supply, b: curve_circulating } }
    watch: { outside: [ -1.5, 0.5 ] }

  # Staking is locking for CRV, as for AERO: both metrics read the escrow's supply(), the CRV held in veCRV locks.
  staked_supply:
    type: level
    unit: tokens
    staleness_days: 7
    source: { type: contract_read, contract: ve, function: supply, decimals: 18 }

  locked_supply:
    type: level
    unit: tokens
    staleness_days: 7
    source: { type: contract_read, contract: ve, function: supply, decimals: 18 }

  # Liquid lockers' share of veCRV, read daily for display, monitor_only: never a driver, never in the grade.
  # ve_power.*: voting power, balanceOf(locker); sets the locker's share of fees and votes. Lockers relock at the max,
  #   so their power barely decays while direct locks do, and their share drifts up even when nothing changes.
  # ve_locked.*: CRV locked, locked(locker).amount; the steadier share (against locked_supply). "Everyone else" is the
  #   remainder of the totals.
  ve_power_total: { type: level, unit: tokens, staleness_days: 7, monitor_only: true, source: { type: contract_read, contract: ve, function: totalSupply, decimals: 18 } }
  ve_power.convex: { type: level, unit: tokens, staleness_days: 7, monitor_only: true, source: { type: contract_read, contract: ve, function: balanceOf, args: [ locker_convex ], decimals: 18 } }
  ve_power.stakedao: { type: level, unit: tokens, staleness_days: 7, monitor_only: true, source: { type: contract_read, contract: ve, function: balanceOf, args: [ locker_stakedao ], decimals: 18 } }
  ve_power.yearn: { type: level, unit: tokens, staleness_days: 7, monitor_only: true, source: { type: contract_read, contract: ve, function: balanceOf, args: [ locker_yearn ], decimals: 18 } }
  ve_locked.convex: { type: level, unit: tokens, staleness_days: 7, monitor_only: true, source: { type: contract_read, contract: ve, function: locked, args: [ locker_convex ], returns: [ int128, uint256 ], pick: 0, decimals: 18 } }
  ve_locked.stakedao: { type: level, unit: tokens, staleness_days: 7, monitor_only: true, source: { type: contract_read, contract: ve, function: locked, args: [ locker_stakedao ], returns: [ int128, uint256 ], pick: 0, decimals: 18 } }
  ve_locked.yearn: { type: level, unit: tokens, staleness_days: 7, monitor_only: true, source: { type: contract_read, contract: ve, function: locked, args: [ locker_yearn ], returns: [ int128, uint256 ], pick: 0, decimals: 18 } }

  staker_emission_share:
    type: level
    unit: ratio
    staleness_days: 7
    source: { type: constant, value: 0, note: "all CRV emissions go to LP gauges; veCRV receives none (CRV.vy, GaugeController)" }

  # Gross emissions to the gauges: the rate in force and the next coded cut (2^(-1/4), each 12 August at 22:17Z), read
  # from the token contract. Each run writes both steps, so the engine sees the cut before it happens.
  emission_rate_annual:
    type: schedule
    unit: tokens_per_year
    staleness_days: 45
    critical: true
    source: { type: adapter, name: crv.emission_rate_annual }

  # The revenue-funded flow to lockers, read on chain: crvUSD into the FeeDistributor from the FeeAllocator, weekly on
  # Wednesdays (six of seven days are zero). DefiLlama's holders revenue adds third-party bribes and runs about 3x this,
  # so it is not a cross-check; bribes are reported separately (vote_incentive_run_rate_usd, income_statement.below_line
  # run_rate). Staleness 10 allows one missed Wednesday (staleness_days is unread since Phase 1; Phase 2 decides its
  # future).
  flow_usd.fees:
    type: flow
    unit: usd
    cadence: daily
    staleness_days: 10
    critical: true
    source: { type: transfer_flow, token: crvusd, to: fee_distributor, from_allowlist: [ fee_allocator ], unit: usd }

  # Votemarket incentives committed to veCRV voters, 180 days scaled to a year (CurveDEX's feed, the one DefiLlama uses).
  # Votium (vlCVX) is excluded: it pays CVX lockers, not CRV holders. Not critical: if the feed dies the signal grades C.
  # The 30-day check is loose on purpose: it catches a dead or restated feed, not a lumpy month.
  vote_incentive_run_rate_usd:
    type: level
    unit: usd
    staleness_days: 10
    source: { type: http_json, url: "https://llama.box/curvedex/api/bribes/stats.json", path: claimsLast180Days.veCRVTotalClaimed, scale: 2.0277777777777777 }
    cross_checks:
      - { tolerance_pct: 50, source: { type: http_json, url: "https://llama.box/curvedex/api/bribes/stats.json", path: claimsLast30Days.veCRVTotalClaimed, scale: 12.166666666666666 } }

  # Report-only (monitor_only, never a driver): Curve's own revenue, every protocol fee in crvUSD as it enters the
  # FeeAllocator (90 percent to veCRV, 10 to the treasury). Weekly, like the holder flow. Read 2026-10-10: 1.42M crvUSD
  # over 91 days.
  # Curve's own 10 percent of fees: FeeAllocator -> Treasury (report-only income line).
  flow_usd.curve_treasury:
    type: flow
    unit: usd
    cadence: daily
    staleness_days: 10
    monitor_only: true
    source: { type: transfer_flow, token: crvusd, to: curve_treasury, from_allowlist: [ fee_allocator ], unit: usd }
  flow_usd.protocol_revenue:
    type: flow
    unit: usd
    cadence: daily
    staleness_days: 10
    monitor_only: true
    source: { type: transfer_flow, token: crvusd, to: fee_allocator, from_allowlist: [ hooker ], unit: usd }

# Carried from the holder_flows and reporting blocks Task 11 retired (the capture rules and haircuts now sit on
# the holders and below_line lines):
# Report-only holder yield and growth (orion report yield): no driver, no grade, no signal. Haircuts are the fraction a
# holder loses turning a payout into cash, sized from pool depth (2026-10-10): crvUSD fees none; vote incentives 3
# percent (a basket of mostly long-tail tokens, sold by the claimer).
# Income statement (Mike, 2026-10-11): revenue = every protocol fee (Hooker -> FeeAllocator); 90 percent paid to veCRV,
# 10 percent kept. Vote incentives are third parties paying veCRV voters, not Curve's revenue (v1 kept them in
# extra_cash; v2 has them below the line).
#
# Income statement v2 (spec 2026-10-28 §6/§8, Phase 2 Task 2): the report's only block since Task 11 retired
# holder_flows and reporting. Revenue = what users pay; each section says where it goes.
income_statement:
  category: dex
  scope: protocol_share_only
  window_days: 91
  revenue:
    - { id: fees, label: "admin fees paid to veCRV (FeeAllocator)", metric: flow_usd.fees }
    - { id: treasury_rev, label: "admin fees kept (FeeAllocator)", metric: flow_usd.curve_treasury }
  cost_of_revenue:
    - { id: lp_fees, to: lps, not_measured: "swap fees to LPs and crvUSD/LlamaLend lender interest: not read yet (Phase 3)" }
  holders:
    - { id: vecrv_fees, of: fees, bucket: cash, haircut: 0, recipient_base: locked, capture_rule: programmatic }
  protocol:
    - { id: treasury, of: treasury_rev }
  below_line:
    - { id: vote_incentives, run_rate: vote_incentive_run_rate_usd, to: holders, bucket: cash, haircut: 0.03, recipient_base: locked, capture_rule: programmatic, note: "third parties paying veCRV voters" }
  checks:
    # tolerance_abs: dust is not a breach (Mike, pre-G2 decision 1): a day breaches past 2 percent AND $1.
    - { id: splitter, type: sum, total: [ flow_usd.protocol_revenue ], parts: [ vecrv_fees, treasury ], tolerance_pct: 2, tolerance_abs: 1 }
