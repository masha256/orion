id: crv
symbol: CRV
name: Curve DAO Token
chain: ethereum
supply_basis: effective_total

# Read live on 2026-10-08 (block 26,146,581); see docs/superpowers/specs/2026-10-08-orion-crv-onboarding-design.md section 2.
contracts:
  token: "0xD533a949740bb3306d119CC777fa900bA034cd52" # CRV; also the emission schedule (rate, start_epoch_time)
  ve: "0x5f3b5DfEb7B28CDbD7FAba78963EE202a494e2A2" # VotingEscrow: veCRV locks; supply() is the CRV locked
  crvusd: "0xf939E0A03FB07F59A73314E73794Be0E57ac1b4E" # the FeeDistributor's token()
  fee_distributor: "0xD16d5eC345Dd86Fb63C6a9C43c517210F1027914" # CurveFeeDistribution: pays veCRV weekly in crvUSD
  fee_allocator: "0x22530d384cd9915e096ead2db7f82ee81f8eb468" # FeeAllocator: 90 percent to the distributor, 10 to the Treasury
  # The liquid lockers' veCRV holders (monitor-only lines below; read live 2026-10-09, all locked to 2030).
  locker_convex: "0x989AEb4d175e16225E39E87d0D97A3360524AD80" # Convex VoterProxy (cvxCRV)
  locker_stakedao: "0x52f541764E6e90eeBc5c21Ff570De0e2D63766B6" # StakeDAO CRV locker (sdCRV)
  locker_yearn: "0xF147b8125d2ef93FB6965Db97D6746952a133934" # Yearn CurveYCRVVoter (yCRV)
  hooker: "0x9a9df35cd8e88565694ca6ad5093c236c7f6f69d" # Hooker: sends every protocol fee (crvUSD) to the FeeAllocator
  curve_treasury: "0x6508ef65b0bd57eabd0f1d52685a70433b2d290b" # Curve Treasury: the FeeAllocator's 10 percent

ingest: { chain_id: 1, rpc_url_env: ORION_ETH_RPC_URL, backfill_days: 100 }

external_ids:
  coingecko: curve-dao-token
  defillama: curve-finance

# Every metric is fetched: CRV has no manual metric, so a bootstrap run finds nothing to research and writes only its journal.
metrics:
  price_usd:
    type: level
    unit: usd
    staleness_days: 3
    critical: true
    source: { type: coingecko, id: curve-dao-token, field: price }
    cross_checks:
      - { tolerance_pct: 2, source: { type: http_json, url: "https://coins.llama.fi/prices/current/ethereum:0xD533a949740bb3306d119CC777fa900bA034cd52", path: "coins.ethereum:0xD533a949740bb3306d119CC777fa900bA034cd52.price" } }

  # No burn: the ERC-20 total is the total supply. Locked CRV stays inside it (supply_basis effective_total).
  total_supply:
    type: level
    unit: tokens
    staleness_days: 7
    critical: true
    source: { type: erc20_supply, token: token }
    cross_checks:
      - { tolerance_pct: 2, source: { type: coingecko, id: curve-dao-token, field: total_supply } }

  # CoinGecko's own definition; informational under effective_total.
  circulating_supply:
    type: level
    unit: tokens
    staleness_days: 14
    source: { type: coingecko, id: curve-dao-token, field: circulating_supply }

  # Staking is locking for CRV, as for AERO: both metrics read the escrow's supply(), the CRV held in veCRV locks.
  staked_supply:
    type: level
    unit: tokens
    staleness_days: 7
    source: { type: contract_read, contract: ve, function: supply, decimals: 18 }

  locked_supply:
    type: level
    unit: tokens
    staleness_days: 7
    source: { type: contract_read, contract: ve, function: supply, decimals: 18 }

  # Liquid lockers' share of veCRV, read daily for display, monitor_only: never a driver, never in the grade.
  # ve_power.*: voting power, balanceOf(locker); sets the locker's share of fees and votes. Lockers relock at the max,
  #   so their power barely decays while direct locks do, and their share drifts up even when nothing changes.
  # ve_locked.*: CRV locked, locked(locker).amount; the steadier share (against locked_supply). "Everyone else" is the
  #   remainder of the totals.
  ve_power_total: { type: level, unit: tokens, staleness_days: 7, monitor_only: true, source: { type: contract_read, contract: ve, function: totalSupply, decimals: 18 } }
  ve_power.convex: { type: level, unit: tokens, staleness_days: 7, monitor_only: true, source: { type: contract_read, contract: ve, function: balanceOf, args: [ locker_convex ], decimals: 18 } }
  ve_power.stakedao: { type: level, unit: tokens, staleness_days: 7, monitor_only: true, source: { type: contract_read, contract: ve, function: balanceOf, args: [ locker_stakedao ], decimals: 18 } }
  ve_power.yearn: { type: level, unit: tokens, staleness_days: 7, monitor_only: true, source: { type: contract_read, contract: ve, function: balanceOf, args: [ locker_yearn ], decimals: 18 } }
  ve_locked.convex: { type: level, unit: tokens, staleness_days: 7, monitor_only: true, source: { type: contract_read, contract: ve, function: locked, args: [ locker_convex ], returns: [ int128, uint256 ], pick: 0, decimals: 18 } }
  ve_locked.stakedao: { type: level, unit: tokens, staleness_days: 7, monitor_only: true, source: { type: contract_read, contract: ve, function: locked, args: [ locker_stakedao ], returns: [ int128, uint256 ], pick: 0, decimals: 18 } }
  ve_locked.yearn: { type: level, unit: tokens, staleness_days: 7, monitor_only: true, source: { type: contract_read, contract: ve, function: locked, args: [ locker_yearn ], returns: [ int128, uint256 ], pick: 0, decimals: 18 } }

  staker_emission_share:
    type: level
    unit: ratio
    staleness_days: 7
    source: { type: constant, value: 0, note: "all CRV emissions go to LP gauges; veCRV receives none (CRV.vy, GaugeController)" }

  # Gross emissions to the gauges: the rate in force and the next coded cut (2^(-1/4), each 12 August at 22:17Z), read
  # from the token contract. Each run writes both steps, so the engine sees the cut before it happens.
  emission_rate_annual:
    type: schedule
    unit: tokens_per_year
    staleness_days: 45
    critical: true
    source: { type: adapter, name: crv.emission_rate_annual }

  # The revenue-funded flow to lockers, read on chain: crvUSD into the FeeDistributor from the FeeAllocator, weekly on
  # Wednesdays (six of seven days are zero). DefiLlama's holders revenue adds third-party bribes and runs about 3x this,
  # so it is not a cross-check; bribes are valued separately (vote_incentive_run_rate_usd, the vote_incentives module).
  # Staleness 10 so one missed Wednesday does not grade the signal D.
  flow_usd.fees:
    type: flow
    unit: usd
    cadence: daily
    staleness_days: 10
    critical: true
    source: { type: transfer_flow, token: crvusd, to: fee_distributor, from_allowlist: [ fee_allocator ], unit: usd, price_coingecko_id: crvusd }

  # The last 91 days (13 Wednesdays) of fees to lockers, scaled to a year. A whole number of weeks, so the count of
  # payouts in the window never changes; the holder flow's window matches it (AERO ruling F2).
  revenue_run_rate_usd:
    type: level
    unit: usd
    staleness_days: 10
    critical: true
    source: { type: derived, name: flow_annualized, params: { metric: flow_usd.fees, days: 91 } }

  # Votemarket incentives committed to veCRV voters, 180 days scaled to a year (CurveDEX's feed, the one DefiLlama uses).
  # Votium (vlCVX) is excluded: it pays CVX lockers, not CRV holders. Not critical: if the feed dies the signal grades C.
  # The 30-day check is loose on purpose: it catches a dead or restated feed, not a lumpy month.
  vote_incentive_run_rate_usd:
    type: level
    unit: usd
    staleness_days: 10
    source: { type: http_json, url: "https://llama.box/curvedex/api/bribes/stats.json", path: claimsLast180Days.veCRVTotalClaimed, scale: 2.0277777777777777 }
    cross_checks:
      - { tolerance_pct: 50, source: { type: http_json, url: "https://llama.box/curvedex/api/bribes/stats.json", path: claimsLast30Days.veCRVTotalClaimed, scale: 12.166666666666666 } }

  # Report-only (monitor_only, never a driver): Curve's own revenue, every protocol fee in crvUSD as it enters the
  # FeeAllocator (90 percent to veCRV, 10 to the treasury). Weekly, like the holder flow. Read 2026-10-10: 1.42M crvUSD
  # over 91 days.
  # Curve's own 10 percent of fees: FeeAllocator -> Treasury (report-only income line).
  flow_usd.curve_treasury:
    type: flow
    unit: usd
    cadence: daily
    staleness_days: 10
    monitor_only: true
    source: { type: transfer_flow, token: crvusd, to: curve_treasury, from_allowlist: [ fee_allocator ], unit: usd, price_coingecko_id: crvusd }
  flow_usd.protocol_revenue:
    type: flow
    unit: usd
    cadence: daily
    staleness_days: 10
    monitor_only: true
    source: { type: transfer_flow, token: crvusd, to: fee_allocator, from_allowlist: [ hooker ], unit: usd, price_coingecko_id: crvusd }

holder_flows:
  - { id: fees, kind: fee_share, capture_rule: programmatic, recipient_base: locked, metric: flow_usd.fees, window_days: 91 }

# Chosen by the user on 2026-10-08: as AERO (no revenue multiple: revenue and the holder flow are one series), plus the
# vote incentives as an additive component on the DIEM precedent. The decay is the contract's own 2^(-1/4) per year.
# price_basis spot (user, 2026-10-08): incentives at today's price, the market's own pricing of the vote, so the
# component is a second view rather than an echo of the fee model's target.
# Structural: the agent may only propose changes here.
modules:
  - { id: hc, type: holder_cashflow, kind: estimate, weight: 0.6 }
  - { id: fm_holder_flow, type: forward_multiple, kind: estimate, weight: 0.4, params: { basis: holder_flow } }
  - { id: vote_incentives, type: vote_incentives, kind: component, params: { metric: vote_incentive_run_rate_usd, years: 10, post_horizon_emission_decay: 0.159103584746285, price_basis: spot, staked_return: locked } }

scenario_probabilities: { bear: 0.25, base: 0.5, bull: 0.25 }

# Key-wide bounds only, wide enough for the calibration sweep.
# Agent bands (2026-10-08), by the mirror rule as for VVV and AERO: each scenario's band is symmetric around its value in
# calibration/crv-assumptions.yaml, the inner edge halfway to the neighbouring scenario's value and the outer edge as far
# again, clipped to min/max. Exceptions: the bull rev_growth_y1 band is half that width (the largest single step, about
# -15 / +19 percent of the 12m expected value at full width); capture_rate_terminal.fees is tied at the 1.0 ceiling in base
# and bull, so those bands run from the bear band's mirror edge up to the ceiling. Keys with no bands (fade, ramp) barely move
# the value and the agent uses min/max. All keys at the edge moved the 12m expected value about -42 / +66 percent ($0.0322
# calibrated). Recalibrate the bands whenever the calibrated values move.
assumptions:
  rev_growth_y1: { min: -0.6, max: 2, bear: { min: -0.5, max: -0.1 }, base: { min: -0.1, max: 0.35 }, bull: { min: 0.475, max: 0.725 } }
  growth_fade_years: { min: 1, max: 8 }
  terminal_growth: { min: 0, max: 0.05, bear: { min: 0, max: 0.01 }, base: { min: 0.01, max: 0.025 }, bull: { min: 0.025, max: 0.035 } }
  capture_rate_terminal.fees: { min: 0.5, max: 1, bear: { min: 0.85, max: 0.95 }, base: { min: 0.95, max: 1 }, bull: { min: 0.95, max: 1 } }
  capture_ramp_years.fees: { min: 0, max: 4 }
  discount_rate_base: { min: 0.08, max: 0.35, bear: { min: 0.24, max: 0.32 }, base: { min: 0.175, max: 0.24 }, bull: { min: 0.125, max: 0.175 } }
  discount_premium_programmatic: { min: 0, max: 0.15, bear: { min: 0.025, max: 0.035 }, base: { min: 0.015, max: 0.025 }, bull: { min: 0.005, max: 0.015 } }
  multiple.fm_holder_flow: { min: 3, max: 60, bear: { min: 4, max: 8 }, base: { min: 8, max: 14 }, bull: { min: 14, max: 22 } }
  regime_multiplier: { min: 0.4, max: 1.6, bear: { min: 0.55, max: 0.85 }, base: { min: 0.85, max: 1.15 }, bull: { min: 1.15, max: 1.45 } }
  staked_ratio_horizon: { min: 0.2, max: 0.6, bear: { min: 0.275, max: 0.325 }, base: { min: 0.325, max: 0.385 }, bull: { min: 0.385, max: 0.455 } }
  incentive_efficiency_drift: { min: -0.5, max: 0.3, bear: { min: -0.3, max: -0.1 }, base: { min: -0.1, max: 0.05 }, bull: { min: 0.05, max: 0.15 } }
  incentive_discount_rate: { min: 0.1, max: 0.5, bear: { min: 0.3, max: 0.4 }, base: { min: 0.215, max: 0.3 }, bull: { min: 0.145, max: 0.215 } }

agent:
  budgets:
    weekly: { input_tokens: 2000000 }

review_triggers:
  driver_deviation_pct: 25
  provisional_move_pct: 25
  calendar:
    - { date: "2027-08-12", note: "CRV emission rate cut, epoch 7 (22:17Z): 97.2M to 81.7M CRV a year" }

peer_set: []

# Report-only holder yield and growth (orion report yield): no driver, no grade, no signal. Haircuts are the fraction a
# holder loses turning a payout into cash, sized from pool depth (2026-10-10): crvUSD fees none; vote incentives 3
# percent (a basket of mostly long-tail tokens, sold by the claimer).
reporting:
  window_days: 91
  haircuts: { fees: 0 }
  extra_cash:
    - { id: vote_incentives, metric: vote_incentive_run_rate_usd, haircut: 0.03, recipient_base: locked }
  # Income statement (Mike, 2026-10-11): revenue = every protocol fee (Hooker -> FeeAllocator); 90 percent paid to veCRV,
  # 10 percent kept. Vote incentives are third parties paying veCRV voters, not Curve's revenue (they stay in extra_cash).
  income:
    lines:
      - { id: vecrv_fees, to: holders, metric: flow_usd.fees }
      - { id: treasury, to: protocol, metric: flow_usd.curve_treasury }
    checks:
      - { total: [ flow_usd.protocol_revenue ], parts: [ vecrv_fees, treasury ] }
