ingest: { chain_id: 1, rpc_url_env: ORION_ETH_RPC_URL, backfill_days: 100 }

external_ids:
  coingecko: chainlink
  defillama: chainlink

# Every metric is fetched on chain (the circulating supply too, since Phase 3 R3): no DefiLlama (Mike, 2026-10-11:
# the Reserve flow and the releases are all readable on Ethereum).
metrics:
  price_usd:
    type: level
    unit: usd
    staleness_days: 3
    critical: true
    # LINK: the LINK/USD feed; check the Uniswap v3 LINK/WETH 1 h TWAP x ETH/USD (prices.yaml; Phase 3 R2: read
    # live at the run, no CoinGecko).
    source: { type: adapter, name: price.token, params: { ref: "eip155:1/0x514910771af9ca656af840dff83e8264ecf986ca" } }
    cross_checks:
      - { tolerance_pct: 2, source: { type: adapter, name: price.token_check, params: { ref: "eip155:1/0x514910771af9ca656af840dff83e8264ecf986ca" } } }

  # 1B, every token minted at launch; nothing has been burned (dead holds about 110 LINK of stray sends, not subtracted).
  # Chainlink's unreleased Safes and the Reserve stay inside (total_supply, the FDV basis on every Orion asset).
  total_supply:
    type: level
    unit: tokens
    staleness_days: 7
    critical: true
    source: { type: erc20_supply, token: token }

  # On chain (Phase 3 R3): the total less Chainlink's 33 listed non-circulating wallets (233,150,029.58 LINK), so
  # 766,849,970.42 on 2026-11-20, equal to Chainlink's own circulatingSupply to the wei. Staked LINK (v0.2, a 28-day
  # cooldown), the Reserve and the release wallets stay in (Chainlink's definition). Display only, the market cap basis.
  circulating_supply:
    type: level
    unit: tokens
    staleness_days: 14
    source:
      type: adapter
      name: chain.view_sum
      params:
        terms:
          - { contract: token, function: totalSupply }
          - { contract: token, function: balanceOf, args: [ nc_01 ], sign: -1 }
          - { contract: token, function: balanceOf, args: [ nc_02 ], sign: -1 }
          - { contract: token, function: balanceOf, args: [ nc_03 ], sign: -1 }
          - { contract: token, function: balanceOf, args: [ nc_04 ], sign: -1 }
          - { contract: token, function: balanceOf, args: [ nc_05 ], sign: -1 }
          - { contract: token, function: balanceOf, args: [ nc_06 ], sign: -1 }
          - { contract: token, function: balanceOf, args: [ nc_07 ], sign: -1 }
          - { contract: token, function: balanceOf, args: [ nc_08 ], sign: -1 }
          - { contract: token, function: balanceOf, args: [ nc_09 ], sign: -1 }
          - { contract: token, function: balanceOf, args: [ nc_10 ], sign: -1 }
          - { contract: token, function: balanceOf, args: [ nc_11 ], sign: -1 }
          - { contract: token, function: balanceOf, args: [ nc_12 ], sign: -1 }
          - { contract: token, function: balanceOf, args: [ nc_13 ], sign: -1 }
          - { contract: token, function: balanceOf, args: [ nc_14 ], sign: -1 }
          - { contract: token, function: balanceOf, args: [ nc_15 ], sign: -1 }
          - { contract: token, function: balanceOf, args: [ nc_16 ], sign: -1 }
          - { contract: token, function: balanceOf, args: [ nc_17 ], sign: -1 }
          - { contract: token, function: balanceOf, args: [ nc_18 ], sign: -1 }
          - { contract: token, function: balanceOf, args: [ nc_19 ], sign: -1 }
          - { contract: token, function: balanceOf, args: [ nc_20 ], sign: -1 }
          - { contract: token, function: balanceOf, args: [ nc_21 ], sign: -1 }
          - { contract: token, function: balanceOf, args: [ nc_22 ], sign: -1 }
          - { contract: token, function: balanceOf, args: [ nc_23 ], sign: -1 }
          - { contract: token, function: balanceOf, args: [ nc_24 ], sign: -1 }
          - { contract: token, function: balanceOf, args: [ nc_25 ], sign: -1 }
          - { contract: token, function: balanceOf, args: [ nc_26 ], sign: -1 }
          - { contract: token, function: balanceOf, args: [ nc_27 ], sign: -1 }
          - { contract: token, function: balanceOf, args: [ nc_28 ], sign: -1 }
          - { contract: token, function: balanceOf, args: [ nc_29 ], sign: -1 }
          - { contract: token, function: balanceOf, args: [ nc_30 ], sign: -1 }
          - { contract: token, function: balanceOf, args: [ nc_31 ], sign: -1 }
          - { contract: token, function: balanceOf, args: [ nc_32 ], sign: -1 }
          - { contract: token, function: balanceOf, args: [ nc_33 ], sign: -1 }

  # The N5 check (Phase 3 R3): Chainlink's own figure (first party) and the gap of ours to it, in percent, 0 on
  # 2026-11-20. Outside [-0.5, 0.5] is an ORION WATCH: Chainlink moved LINK to a wallet not listed here yet (add it from
  # balances[]), or the API lags a release. Both are read, and the watch checked, at the nightly run only: the hourly
  # read skips derived and unwatched monitor-only metrics.
  chainlink_circulating:
    type: level
    unit: tokens
    staleness_days: 3
    monitor_only: true
    source: { type: http_json, url: "https://supply.chain.link/supply", path: circulatingSupply, decimals: 18 }
  circulating_gap_chainlink:
    type: level
    unit: pct
    staleness_days: 3
    monitor_only: true
    source: { type: derived, name: level_gap_pct, params: { a: circulating_supply, b: chainlink_circulating } }
    watch: { outside: [ -0.5, 0.5 ] }

  # Staking v0.2 pays rewards from Chainlink's own allocation, not from fees: not a holder flow, and the Reserve's buys
  # reach every holder alike.
  staked_supply:
    type: level
    unit: tokens
    staleness_days: 7
    source: { type: constant, value: 0, note: "staking rewards come from Chainlink's allocation, not fees; the Reserve's buys reach every holder" }

  staker_emission_share:
    type: level
    unit: ratio
    staleness_days: 7
    source: { type: constant, value: 0, note: "no emissions" }

  # No minting: all 1B were minted at launch. The quarterly releases move tokens already in total supply, so they are
  # reported as dilution (income_statement.dilution), never counted as an emission.
  emission_rate_annual:
    type: schedule
    unit: tokens_per_year
    staleness_days: 45
    critical: true
    source: { type: constant, value: 0, note: "1B minted at launch; releases move tokens already in total supply" }

  # The holder flow: LINK the fee converter sends the Reserve, at each day's price. Paid weekly (Thursdays), so the window
  # is 91 days (13 payouts). The dust floor applies to other senders only: about 30 test sends from other wallets (21 LINK
  # in all, August 2025) are ignored; anything larger from anyone else raises an unlisted-sender alert.
  flow_usd.reserve:
    type: flow
    unit: usd
    cadence: daily
    staleness_days: 10
    critical: true
    source: { type: transfer_flow, token: token, to: reserve, from_allowlist: [ fee_converter ], ignore_below_tokens: 10, unit: usd }

  # The same buys in LINK: 375k to 707k a month (2026), the flow's own measure.
  flow_tokens.reserve:
    type: flow
    unit: tokens
    cadence: daily
    staleness_days: 10
    monitor_only: true
    source: { type: transfer_flow, token: token, to: reserve, from_allowlist: [ fee_converter ], ignore_below_tokens: 10, unit: tokens }

  # Report-only: the Reserve's balance (it should only grow; a fall is a withdrawal to look at).
  reserve_link: { type: level, unit: tokens, staleness_days: 7, monitor_only: true, source: { type: contract_read, contract: token, function: balanceOf, args: [ reserve ], decimals: 18 } }

  # Report-only dilution: the quarterly releases from Chainlink's non-circulating Safes, read as LINK arriving at the two
  # release wallets (any sender: the source Safes rotate; dust under 1,000 LINK is address poisoning). 58.9M + 11.1M =
  # 70.0M in the year to 2026-10-16, matching CoinGecko's circulating supply rising from 696M to 767M. Quarterly lumps, so
  # the rate is the last 365 days.
  flow_tokens.released_hub:
    type: flow
    unit: tokens
    cadence: daily
    staleness_days: 120
    monitor_only: true
    source: { type: transfer_flow, token: token, to: release_hub, from_any: true, ignore_below_tokens: 1000, unit: tokens }
  flow_tokens.released_rewards:
    type: flow
    unit: tokens
    cadence: daily
    staleness_days: 120
    monitor_only: true
    source: { type: transfer_flow, token: token, to: release_rewards, from_any: true, ignore_below_tokens: 1000, unit: tokens }
  released_rate: { type: level, unit: tokens_per_year, staleness_days: 120, monitor_only: true, source: { type: derived, name: flow_annualized, params: { metrics: [ flow_tokens.released_hub, flow_tokens.released_rewards ], days: 365 } } }

# Carried from the holder_flows and reporting blocks Task 11 retired (the capture rules and haircuts now sit on
# the holders and below_line lines):
# buy_and_hold, discretionary (Mike, 2026-10-16): Chainlink chooses which revenue is routed on chain and controls the
# Reserve's timelock. Held, not burned: on total supply the flow does not shrink the supply path.
# Report-only holder yield and growth. A hold: 5 percent overhang haircut (Mike, 2026-10-16: Chainlink controls the
# timelock and can release the Reserve). Revenue = the fees Chainlink routes on chain (the Reserve's buys); its
# enterprise revenue is private. The releases are the dilution.
#
# Income statement v2 (spec 2026-10-28 §6/§8, Phase 2 Task 2): the report's only block since Task 11 retired
# holder_flows and reporting. Revenue = what users pay; each section says where it goes.
income_statement:
  category: oracle
  scope: protocol_share_only
  window_days: 91
  revenue:
    - { id: onchain_fees, label: "on-chain service fees converted to LINK (Payment Abstraction)", metric: flow_usd.reserve, settlement: daily }
  cost_of_revenue:
    - { id: node_operators, to: node_operators, not_measured: "fees paid to node operators (CCIP fee tokens, off-chain Data Feeds): not read yet (Phase 3)" }
  holders:
    - { id: reserve, of: onchain_fees, bucket: hold, haircut: 0.05, recipient_base: all, capture_rule: discretionary, note: "fees converted to LINK and held in the Chainlink Reserve" }
  dilution:
    - { id: releases, metric: released_rate, note: "quarterly releases from Chainlink's non-circulating Safes (trailing 365 days)" }
  # Reconciliation checks (spec §5, Phase 2 Task 5): the price (the LINK/USD feed since Phase 3 R2) vs its prices.yaml
  # check, the Uniswap v3 LINK/WETH pool (the price.token_check cross-check's stored reading); the Reserve's day change in LINK vs the scanned buys (no outflow is expected; a fall
  # is a withdrawal). tolerance_abs 10 LINK is a per-day allowance for the scan's per-transfer floor (ignore_below_tokens
  # 10: dust transfers under it are not counted); several such transfers in one day can exceed it and breach. LINK
  # from senders the scan does not list is not covered by the allowance: it should breach.
  checks:
    - { id: price_chainlink, type: price, level: price_usd, against: price.token_check, tolerance_pct: 2 }
    - { id: reserve_balance, type: balance, level: reserve_link, inflows: [ flow_tokens.reserve ], outflows: [], tolerance_pct: 1, tolerance_abs: 10 }
