id: link
symbol: LINK
name: Chainlink
chain: ethereum

# Read live on 2026-10-16; see docs/superpowers/notes/2026-10-16-link-onboarding.md.
# The fee route: service fees paid on chain (many tokens) are converted to LINK by Payment Abstraction and sent every
# Thursday to the Chainlink Reserve, a timelock that has never spent (one 1-LINK test out, 2025-08-02). The buys are the
# holder flow, held, not burned (Mike, 2026-10-16: buy_and_hold, discretionary, total supply, the Reserve not netted).
contracts:
  token: "0x514910771AF9Ca656af840dff83E8264EcF986CA" # LINK (ERC-677/ERC-20, 1B minted, no burns)
  reserve: "0x9A709B7B69EA42D5eeb1ceBC48674C69E1569eC6" # Chainlink Reserve (RBACTimelock): 6.29M LINK on 2026-10-16
  fee_converter: "0x5680681ED3767B96914CE741a308155C7fB9171d" # Payment Abstraction: converts fees to LINK, the Reserve's only paying sender
  chainlink_link_usd: "0x2c1d072e956AFFC0D435Cb7AC38EF18d24d9127c" # Chainlink LINK / USD, 8 decimals
  # The quarterly releases from Chainlink's non-circulating Safes land in these two wallets (2026-10-16, traced on chain):
  release_hub: "0x9b1c1752b6b6eaf62a8c491a8681b32c1f7ecde9" # EOA: forwards every release to an exchange wallet within hours (253.8M since 2022-08)
  release_rewards: "0xD50f074Ec5c7997cE1DaacB513Ec194C480878Af" # Safe: drips about 0.5M LINK a week onward (rewards); funded each quarter

ingest: { chain_id: 1, rpc_url_env: ORION_ETH_RPC_URL, backfill_days: 100 }

external_ids:
  coingecko: chainlink
  defillama: chainlink

# Every metric is fetched on chain except the price and the circulating supply (CoinGecko): no DefiLlama (Mike, 2026-10-11:
# the Reserve flow and the releases are all readable on Ethereum).
metrics:
  price_usd:
    type: level
    unit: usd
    staleness_days: 3
    critical: true
    source: { type: coingecko, id: chainlink, field: price }
    cross_checks:
      - { tolerance_pct: 2, source: { type: contract_read, contract: chainlink_link_usd, function: latestAnswer, decimals: 8 } }

  # 1B, every token minted at launch; nothing has been burned (dead holds about 110 LINK of stray sends, not subtracted).
  # Chainlink's unreleased Safes and the Reserve stay inside (total_supply, the FDV basis on every Orion asset).
  total_supply:
    type: level
    unit: tokens
    staleness_days: 7
    critical: true
    source: { type: erc20_supply, token: token }
    cross_checks:
      - { tolerance_pct: 2, source: { type: coingecko, id: chainlink, field: total_supply } }

  # CoinGecko's own definition (767M on 2026-10-16); display only, the report's market cap basis.
  circulating_supply:
    type: level
    unit: tokens
    staleness_days: 14
    source: { type: coingecko, id: chainlink, field: circulating_supply }

  # Staking v0.2 pays rewards from Chainlink's own allocation, not from fees: not a holder flow, and the Reserve's buys
  # reach every holder alike.
  staked_supply:
    type: level
    unit: tokens
    staleness_days: 7
    source: { type: constant, value: 0, note: "staking rewards come from Chainlink's allocation, not fees; the Reserve's buys reach every holder" }

  staker_emission_share:
    type: level
    unit: ratio
    staleness_days: 7
    source: { type: constant, value: 0, note: "no emissions" }

  # No minting: all 1B were minted at launch. The quarterly releases move tokens already in total supply, so they are
  # reported as dilution (reporting.dilution), never counted as an emission.
  emission_rate_annual:
    type: schedule
    unit: tokens_per_year
    staleness_days: 45
    critical: true
    source: { type: constant, value: 0, note: "1B minted at launch; releases move tokens already in total supply" }

  # The holder flow: LINK the fee converter sends the Reserve, at each day's price. Paid weekly (Thursdays), so the window
  # is 91 days (13 payouts). The dust floor applies to other senders only: about 30 test sends from other wallets (21 LINK
  # in all, August 2025) are ignored; anything larger from anyone else raises an unlisted-sender alert.
  flow_usd.reserve:
    type: flow
    unit: usd
    cadence: daily
    staleness_days: 10
    critical: true
    source: { type: transfer_flow, token: token, to: reserve, from_allowlist: [ fee_converter ], ignore_below_tokens: 10, unit: usd, price_coingecko_id: chainlink }

  # The same buys in LINK: 375k to 707k a month (2026), the flow's own measure.
  flow_tokens.reserve:
    type: flow
    unit: tokens
    cadence: daily
    staleness_days: 10
    monitor_only: true
    source: { type: transfer_flow, token: token, to: reserve, from_allowlist: [ fee_converter ], ignore_below_tokens: 10, unit: tokens }

  # Report-only: the Reserve's balance (it should only grow; a fall is a withdrawal to look at).
  reserve_link: { type: level, unit: tokens, staleness_days: 7, monitor_only: true, source: { type: contract_read, contract: token, function: balanceOf, args: [ reserve ], decimals: 18 } }

  # Report-only dilution: the quarterly releases from Chainlink's non-circulating Safes, read as LINK arriving at the two
  # release wallets (any sender: the source Safes rotate; dust under 1,000 LINK is address poisoning). 58.9M + 11.1M =
  # 70.0M in the year to 2026-10-16, matching CoinGecko's circulating supply rising from 696M to 767M. Quarterly lumps, so
  # the rate is the last 365 days.
  flow_tokens.released_hub:
    type: flow
    unit: tokens
    cadence: daily
    staleness_days: 120
    monitor_only: true
    source: { type: transfer_flow, token: token, to: release_hub, from_any: true, ignore_below_tokens: 1000, unit: tokens }
  flow_tokens.released_rewards:
    type: flow
    unit: tokens
    cadence: daily
    staleness_days: 120
    monitor_only: true
    source: { type: transfer_flow, token: token, to: release_rewards, from_any: true, ignore_below_tokens: 1000, unit: tokens }
  released_rate: { type: level, unit: tokens_per_year, staleness_days: 120, monitor_only: true, source: { type: derived, name: flow_annualized, params: { metrics: [ flow_tokens.released_hub, flow_tokens.released_rewards ], days: 365 } } }

# buy_and_hold, discretionary (Mike, 2026-10-16): Chainlink chooses which revenue is routed on chain and controls the
# Reserve's timelock. Held, not burned: on total supply the flow does not shrink the supply path.
holder_flows:
  - { id: reserve, kind: buy_and_hold, capture_rule: discretionary, recipient_base: all, metric: flow_usd.reserve, window_days: 91 }

# Report-only holder yield and growth. A hold: 5 percent overhang haircut (Mike, 2026-10-16: Chainlink controls the
# timelock and can release the Reserve). Revenue = the fees Chainlink routes on chain (the Reserve's buys); its enterprise
# revenue is private. The releases are the dilution.
reporting:
  window_days: 91
  haircuts: { reserve: 0.05 }
  revenue:
    - { id: onchain_fees, label: "on-chain service fees converted to LINK (Payment Abstraction)", metric: flow_usd.reserve, settlement: daily }
  income:
    lines:
      - { id: reserve, to: holders, metric: flow_usd.reserve, note: "fees converted to LINK and held in the Chainlink Reserve" }
  dilution:
    - { id: releases, metric: released_rate, note: "quarterly releases from Chainlink's non-circulating Safes (trailing 365 days)" }

# Income statement v2 (spec 2026-10-28 §6/§8, Phase 2 Task 2), beside reporting for one release (the report still reads
# reporting; Task 11 removes it). Revenue = what users pay; each section says where it goes.
income_statement:
  category: oracle
  scope: protocol_share_only
  window_days: 91
  revenue:
    - { id: onchain_fees, label: "on-chain service fees converted to LINK (Payment Abstraction)", metric: flow_usd.reserve, settlement: daily }
  cost_of_revenue:
    - { id: node_operators, to: node_operators, not_measured: "fees paid to node operators (CCIP fee tokens, off-chain Data Feeds): not read yet (Phase 3)" }
  holders:
    - { id: reserve, of: onchain_fees, bucket: hold, haircut: 0.05, recipient_base: all, capture_rule: discretionary, note: "fees converted to LINK and held in the Chainlink Reserve" }
  dilution:
    - { id: releases, metric: released_rate, note: "quarterly releases from Chainlink's non-circulating Safes (trailing 365 days)" }
  # Reconciliation checks (spec §5, Phase 2 Task 5): CoinGecko's price vs the Chainlink LINK/USD feed (the price
  # cross-check's stored reading); the Reserve's day change in LINK vs the scanned buys (no outflow is expected; a fall
  # is a withdrawal). tolerance_abs 10 LINK is a per-day allowance for the scan's per-transfer floor (ignore_below_tokens
  # 10: dust transfers under it are not counted); several such transfers in one day can exceed it and breach. LINK
  # from senders the scan does not list is not covered by the allowance: it should breach.
  checks:
    - { id: price_chainlink, type: price, level: price_usd, against: chainlink_link_usd, tolerance_pct: 2 }
    - { id: reserve_balance, type: balance, level: reserve_link, inflows: [ flow_tokens.reserve ], outflows: [], tolerance_pct: 1, tolerance_abs: 10 }
