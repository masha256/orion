# yCRV (Yearn): a liquid claim on veCRV locked permanently by Yearn's CurveYCRVVoter, valued as staked in the
# YearnBoostedStaker (YBS) for its crvUSD rewards. The auto-compounding vault (st-yCRV, legacy) is out of scope: the user
# chose to model the staking that pays crvUSD, the shape the other liquid lockers share (cvxCRV, sdCRV).
#
# Cash path, read on chain 2026-10-08/09 (spec docs/superpowers/specs/2026-10-09-orion-ycrv-onboarding-design.md):
#   Curve FeeDistributor -> voter -> YCRVSplitter (fees, crvUSD)
#   Yearn FeeBurner (vote incentives sold to crvUSD) -> YCRVSplitter
#   YCRVSplitter: deposits crvUSD into the crvUSD-2 yVault and splits the shares on-chain ratios (2026-10-09: fees 87.3
#     percent to YBS stakers, the unstaked yCRV's share to the treasury; incentives 78.0 / 9.3 / 12.7) -> Receiver
#   Receiver: takes a 10 percent performance fee (performanceFee 1000 bps) -> SingleTokenRewardDistributor (weekly)
# The holder flow is the last hop: yvcrvUSD-2 shares into the distributor from the Receiver, converted to crvUSD at the
# vault's pricePerShare at the end of each day and priced as crvUSD. 91 days to 2026-10-09: 329,347 shares, about
# 381,700 crvUSD, about 1.53M USD a year to 63.3M staked yCRV. About 74 percent of it is vote incentives, which shrink
# with CRV emissions; that is the main open question for the growth assumptions, not a separate component.
id: ycrv
symbol: yCRV
name: Yearn CRV (staked in YearnBoostedStaker)
chain: ethereum
supply_basis: effective_total

contracts:
  token: "0xFCc5c47bE19d06BF83eB04298b026F81069ff65b" # yCRV
  ybs: "0xE9A115b77A1057C918F997c32663FdcE24FB873f" # YearnBoostedStaker: staked yCRV; totalSupply() is the yCRV staked
  yv_crvusd: "0xBF319dDC2Edc1Eb6FDf9910E39b37Be221C8805F" # crvUSD-2 yVault: the reward token, shares of crvUSD
  receiver: "0x642a16a7885d7a8b9353e2a4b68834f31389dc2c" # Receiver: the splitter's YBS recipient, takes the performance fee
  distributor: "0xb226c52eb411326cdb54824a88abafdaaff16d3d" # SingleTokenRewardDistributor: pays YBS stakers weekly
  voter: "0xF147b8125d2ef93FB6965Db97D6746952a133934" # CurveYCRVVoter: Yearn's veCRV (reference; not read)
  splitter: "0x05fc8174050f0a41deb7e562187911d45cd5e401" # YCRVSplitter (reference; not read)

ingest: { chain_id: 1, rpc_url_env: ORION_ETH_RPC_URL, backfill_days: 100 }

external_ids:
  coingecko: yearn-crv
  defillama: yearn-finance

metrics:
  price_usd:
    type: level
    unit: usd
    staleness_days: 3
    critical: true
    source: { type: coingecko, id: yearn-crv, field: price }
    cross_checks:
      - { tolerance_pct: 2, source: { type: http_json, url: "https://coins.llama.fi/prices/current/ethereum:0xFCc5c47bE19d06BF83eB04298b026F81069ff65b", path: "coins.ethereum:0xFCc5c47bE19d06BF83eB04298b026F81069ff65b.price" } }

  effective_supply:
    type: level
    unit: tokens
    staleness_days: 7
    critical: true
    source: { type: erc20_supply, token: token }

  staked_supply:
    type: level
    unit: tokens
    staleness_days: 7
    critical: true
    source: { type: contract_read, contract: ybs, function: totalSupply, decimals: 18 }

  staker_emission_share:
    type: level
    unit: ratio
    staleness_days: 7
    source: { type: constant, value: 0, note: "yCRV has no emissions; stakers are paid in crvUSD, valued as the holder flow" }

  emission_rate_annual:
    type: schedule
    unit: tokens_per_year
    staleness_days: 7
    critical: true
    source: { type: constant, value: 0, note: "yCRV is minted 1:1 against CRV locked by Yearn; no emission schedule" }

  flow_usd.fees:
    type: flow
    unit: usd
    cadence: daily
    staleness_days: 10
    critical: true
    source:
      type: transfer_flow
      token: yv_crvusd
      to: distributor
      from_allowlist: [ receiver ]
      unit: usd
      price_coingecko_id: crvusd
      share_price: { contract: yv_crvusd, function: pricePerShare, decimals: 18 }

  revenue_run_rate_usd:
    type: level
    unit: usd
    staleness_days: 10
    critical: true
    source: { type: derived, name: flow_annualized, params: { metric: flow_usd.fees, days: 91 } }

holder_flows:
  # Paid only to staked yCRV (the unstaked share goes to Yearn's treasury), so valued per staked token.
  - { id: fees, kind: fee_share, capture_rule: programmatic, recipient_base: staked, valued_per: recipients, metric: flow_usd.fees, window_days: 91 }

modules:
  - { id: hc, type: holder_cashflow, kind: estimate, weight: 0.6 }
  - { id: fm_holder_flow, type: forward_multiple, kind: estimate, weight: 0.4, params: { basis: holder_flow } }

scenario_probabilities: { bear: 0.25, base: 0.5, bull: 0.25 }

# Key-wide bounds only, wide enough for the calibration sweep. Bands come with calibration.
assumptions:
  rev_growth_y1: { min: -0.6, max: 2 }
  growth_fade_years: { min: 1, max: 8 }
  terminal_growth: { min: -0.2, max: 0.05 }
  capture_rate_terminal.fees: { min: 0.5, max: 1 }
  capture_ramp_years.fees: { min: 0, max: 4 }
  discount_rate_base: { min: 0.08, max: 0.35 }
  discount_premium_programmatic: { min: 0, max: 0.15 }
  multiple.fm_holder_flow: { min: 3, max: 60 }
  regime_multiplier: { min: 0.4, max: 1.6 }
  staked_ratio_horizon: { min: 0.5, max: 1 }

agent:
  budgets:
    weekly: { input_tokens: 2000000 }

review_triggers:
  driver_deviation_pct: 25
  provisional_move_pct: 25
  calendar:
    - { date: "2027-08-12", note: "CRV emission rate cut (97.2M to 81.7M CRV a year): vote incentives, most of yCRV's cash, track emissions" }

peer_set: []
