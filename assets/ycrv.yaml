# yCRV (Yearn): a liquid claim on veCRV locked permanently by Yearn's CurveYCRVVoter, valued as staked in the
# YearnBoostedStaker (YBS) for its crvUSD rewards. The auto-compounding vault (st-yCRV, legacy) is out of scope: the user
# chose to model the staking that pays crvUSD, the shape the other liquid lockers share (cvxCRV, sdCRV).
#
# Cash path, read on chain 2026-10-08/09 (spec docs/superpowers/specs/2026-10-09-orion-ycrv-onboarding-design.md):
#   Curve FeeDistributor -> voter -> YCRVSplitter (fees, crvUSD)
#   Yearn FeeBurner (vote incentives sold to crvUSD) -> YCRVSplitter
#   YCRVSplitter: deposits crvUSD into the crvUSD-2 yVault and splits the shares on-chain ratios (2026-10-09: fees 87.3
#     percent to YBS stakers, the unstaked yCRV's share to the treasury; incentives 78.0 / 9.3 / 12.7) -> Receiver
#   Receiver: takes a 10 percent performance fee (performanceFee 1000 bps) -> SingleTokenRewardDistributor (weekly)
# The holder flow is the last hop: yvcrvUSD-2 shares into the distributor from the Receiver, converted to crvUSD at the
# vault's pricePerShare at the end of each day and priced as crvUSD. 91 days to 2026-10-09: 329,347 shares, about
# 381,700 crvUSD, about 1.53M USD a year to 63.3M staked yCRV. About 74 percent of it is vote incentives, which shrink
# with CRV emissions; that is the main open question for this flow's growth, not a separate component.
id: ycrv
symbol: yCRV
name: Yearn CRV (staked in YearnBoostedStaker)
chain: ethereum

contracts:
  token: "0xFCc5c47bE19d06BF83eB04298b026F81069ff65b" # yCRV
  ybs: "0xE9A115b77A1057C918F997c32663FdcE24FB873f" # YearnBoostedStaker: staked yCRV; totalSupply() is the yCRV staked
  yv_crvusd: "0xBF319dDC2Edc1Eb6FDf9910E39b37Be221C8805F" # crvUSD-2 yVault: the reward token, shares of crvUSD
  receiver: "0x642a16a7885d7a8b9353e2a4b68834f31389dc2c" # Receiver: the splitter's YBS recipient, takes the performance fee
  distributor: "0xb226c52eb411326cdb54824a88abafdaaff16d3d" # SingleTokenRewardDistributor: pays YBS stakers weekly
  voter: "0xF147b8125d2ef93FB6965Db97D6746952a133934" # CurveYCRVVoter: Yearn's veCRV (reference; not read)
  splitter: "0x05fc8174050f0a41deb7e562187911d45cd5e401" # YCRVSplitter (reference; not read)
  crvusd: "0xf939E0A03FB07F59A73314E73794Be0E57ac1b4E"
  fee_burner: "0xb911fcce8d5afcec73e072653107260bb23c1ee8" # Yearn FeeBurner: auctions the vote incentives into crvUSD for the splitter
  yearn_treasury: "0x044f9c86a0da637a235e83564215dc271bc0defc" # SimpleTreasuryVault: the splitter's 20 percent and the Receiver's 10
  # st-yCRV (yVault 0.4.3, auto-compounding yCRV): 10 percent performance fee, paid to the treasury in its own shares.
  st_ycrv: "0x27b5739e22ad9033bcbf192059122d163b60349d"
  # YCrvRevenueSwapper (owner 0x4444aaaacdba5580282365e25b16309bd770ce4a): since ~2026-10-07 it sells st-yCRV fee shares the
  # treasury already earned (110K passed via the Yearn multisig) for crvUSD and mints yvcrvUSD back to the treasury. The fee
  # is counted when earned (flow_usd.yearn_styc_fee); counting the conversion too would double it, so it is ignored here.
  # The mint is from 0x0, hence mint_sender below.
  yvycrv_fee_converter: "0x988feb96c388cc010564bb8c8ad5cec8d479a2a2"

ingest: { chain_id: 1, rpc_url_env: ORION_ETH_RPC_URL, backfill_days: 100 }

external_ids:
  coingecko: yearn-crv
  defillama: yearn-finance

metrics:
  price_usd:
    type: level
    unit: usd
    staleness_days: 3
    critical: true
    source: { type: coingecko, id: yearn-crv, field: price }
    cross_checks:
      - { tolerance_pct: 2, source: { type: http_json, url: "https://coins.llama.fi/prices/current/ethereum:0xFCc5c47bE19d06BF83eB04298b026F81069ff65b", path: "coins.ethereum:0xFCc5c47bE19d06BF83eB04298b026F81069ff65b.price" } }

  total_supply:
    type: level
    unit: tokens
    staleness_days: 7
    critical: true
    source: { type: erc20_supply, token: token }

  # CoinGecko has no circulating supply for this wrapper (Mike, 2026-10-12): every token is in circulation, so it is
  # the on-chain total. Display basis for market cap only.
  circulating_supply:
    type: level
    unit: tokens
    staleness_days: 14
    source: { type: erc20_supply, token: token }

  staked_supply:
    type: level
    unit: tokens
    staleness_days: 7
    critical: true
    source: { type: contract_read, contract: ybs, function: totalSupply, decimals: 18 }

  staker_emission_share:
    type: level
    unit: ratio
    staleness_days: 7
    source: { type: constant, value: 0, note: "yCRV has no emissions; stakers are paid in crvUSD, valued as the holder flow" }

  emission_rate_annual:
    type: schedule
    unit: tokens_per_year
    staleness_days: 7
    critical: true
    source: { type: constant, value: 0, note: "yCRV is minted 1:1 against CRV locked by Yearn; no emission schedule" }

  flow_usd.fees:
    type: flow
    unit: usd
    cadence: daily
    staleness_days: 10
    critical: true
    source:
      type: transfer_flow
      token: yv_crvusd
      to: distributor
      from_allowlist: [ receiver ]
      unit: usd
      price_coingecko_id: crvusd
      share_price: { contract: yv_crvusd, function: pricePerShare, decimals: 18 }

  # Report-only (monitor_only, never a driver). Yearn's revenue on yCRV: the vault shares its treasury vault takes, 20
  # percent from the splitter and the Receiver's 10 percent performance fee, about 28 percent of what the splitter mints
  # (2026-10-10, 91 days: 129K of 459K yvcrvUSD). The gross is the crvUSD the splitter receives: Curve fees from the
  # voter and the vote incentives FeeBurner sells (about 529K over 91 days).
  flow_usd.yearn_revenue:
    type: flow
    unit: usd
    cadence: daily
    staleness_days: 10
    monitor_only: true
    source:
      type: transfer_flow
      token: yv_crvusd
      to: yearn_treasury
      from_allowlist: [ splitter, receiver ]
      # from_ignore: the fee converter (contracts above): a re-conversion of st-yCRV fees counted in yearn_styc_fee.
      # Its mints are found by their ERC-4626 Deposit (mint_sender).
      from_ignore: [ yvycrv_fee_converter ]
      mint_sender: erc4626_deposit
      unit: usd
      price_coingecko_id: crvusd
      share_price: { contract: yv_crvusd, function: pricePerShare, decimals: 18 }
  # Yearn's st-yCRV performance fee (10 percent of the vault's gains), paid daily to the treasury in st-yCRV shares and
  # valued as shares x pricePerShare x yCRV. Part of Yearn's yCRV revenue (Mike, 2026-10-11): ~$30K in the 91 days to
  # 2026-10-11, ~$49K in the 91 before.
  flow_usd.yearn_styc_fee:
    type: flow
    unit: usd
    cadence: daily
    staleness_days: 10
    monitor_only: true
    source:
      type: transfer_flow
      token: st_ycrv
      to: yearn_treasury
      from_allowlist: [ st_ycrv ]
      unit: usd
      price_coingecko_id: yearn-crv
      share_price: { contract: st_ycrv, function: pricePerShare, decimals: 18 }
  flow_usd.yearn_gross:
    type: flow
    unit: usd
    cadence: daily
    staleness_days: 10
    monitor_only: true
    source: { type: transfer_flow, token: crvusd, to: splitter, from_allowlist: [ voter, fee_burner ], unit: usd, price_coingecko_id: crvusd }
  # Report-only: flow_usd.yearn_gross by sender (Mike G1, Phase 2 Task 7b). Fees = the veCRV fees Yearn's voter claims
  # (what users pay: revenue); incentives = the third-party vote incentives Yearn's FeeBurner auctions into crvUSD (below
  # the line, as sdCRV's bribes). Same scan as yearn_gross (same token, sink and allowlist, one cursor and one pricing pass),
  # each counting one sender (count_from), so fees + incentives = yearn_gross every day by construction, within float
  # rounding (check gross_by_sender). 93 days to 2026-11-04: fees 25 percent, incentives 75 percent.
  flow_usd.yearn_gross_fees:
    type: flow
    unit: usd
    cadence: daily
    staleness_days: 10
    monitor_only: true
    source: { type: transfer_flow, token: crvusd, to: splitter, from_allowlist: [ voter, fee_burner ], count_from: [ voter ], unit: usd, price_coingecko_id: crvusd }
  flow_usd.yearn_gross_incentives:
    type: flow
    unit: usd
    cadence: daily
    staleness_days: 10
    monitor_only: true
    source: { type: transfer_flow, token: crvusd, to: splitter, from_allowlist: [ voter, fee_burner ], count_from: [ fee_burner ], unit: usd, price_coingecko_id: crvusd }

holder_flows:
  # Paid only to staked yCRV (the unstaked share goes to Yearn's treasury), so valued per staked token.
  - { id: fees, kind: fee_share, capture_rule: programmatic, recipient_base: staked, valued_per: recipients, metric: flow_usd.fees, window_days: 91 }

# Report-only holder yield and growth (orion report yield). Paid in crvUSD vault shares, redeemable 1:1: no haircut.
reporting:
  window_days: 91
  haircuts: { fees: 0 }
  volume: [ flow_usd.yearn_gross ]
  # Income statement (Mike, 2026-10-11). Revenue = crvUSD into the splitter (veCRV fees and auctioned vote incentives) plus the
  # st-yCRV performance fee. Paid to YBS stakers via the Receiver; Yearn keeps the splitter's 20, the Receiver's 10, and the fee.
  income:
    lines:
      - { id: ybs_payout, to: holders, metric: flow_usd.fees }
      - { id: treasury, to: protocol, metric: flow_usd.yearn_revenue }
      - { id: styc_fee, to: protocol, metric: flow_usd.yearn_styc_fee }
    checks:
      - { total: [ flow_usd.yearn_gross ], parts: [ ybs_payout, treasury ] }

# Income statement v2 (spec 2026-10-28 §6/§8, Phase 2 Task 2), beside reporting for one release (the report still reads
# reporting; Task 11 removes it). Revenue = what users pay; each section says where it goes.
# Task 7b (Mike G1): revenue is the veCRV fees only; the auctioned vote incentives are below the line (spec rule 3, as
# sdCRV's bribes). The splitter pays both on as one stream, so the measured YBS payouts and treasury take are each split
# by the window's sender mix (apportion, ruling R14): fees / gross from revenue, incentives / gross below the line. The
# splitter's own ratios differ by source (87.3 vs 78.0 percent to YBS), so from-revenue holder flow is slightly understated
# (followups note); holder flow in total is the measured payouts, unchanged.
income_statement:
  category: liquid_locker
  scope: complete
  window_days: 91
  # The st-yCRV performance fee is inside the YBS payouts (probe 2026-11-04): it is not a line here.
  revenue:
    - { id: fees_rev, label: "veCRV fees Yearn's voter sends the splitter (crvUSD)", metric: flow_usd.yearn_gross_fees }
  holders:
    - { id: ybs_payout, metric: flow_usd.fees, apportion: { by: flow_usd.yearn_gross_fees, total: flow_usd.yearn_gross }, bucket: cash, haircut: 0, recipient_base: staked, valued_per: recipients, capture_rule: programmatic }
  protocol:
    - { id: treasury, metric: flow_usd.yearn_revenue, apportion: { by: flow_usd.yearn_gross_fees, total: flow_usd.yearn_gross } }
  below_line:
    - { id: incentives_to_holders, to: holders, metric: flow_usd.fees, apportion: { by: flow_usd.yearn_gross_incentives, total: flow_usd.yearn_gross }, bucket: cash, haircut: 0, recipient_base: staked, valued_per: recipients, capture_rule: programmatic, note: "auctioned third-party vote incentives (Yearn FeeBurner)" }
    - { id: incentives_to_protocol, to: protocol, metric: flow_usd.yearn_revenue, apportion: { by: flow_usd.yearn_gross_incentives, total: flow_usd.yearn_gross }, note: "auctioned third-party vote incentives (Yearn FeeBurner)" }
  checks:
    # Every line of each apportion set: together they read flow_usd.fees and flow_usd.yearn_revenue whole, as before.
    # tolerance_abs: dust is not a breach (Mike, pre-G2 decision 1): past 2 percent AND $1. Not on gross_by_sender below.
    - { id: splitter, type: sum, total: [ flow_usd.yearn_gross ], parts: [ ybs_payout, incentives_to_holders, treasury, incentives_to_protocol ], tolerance_pct: 2, tolerance_abs: 1 }
    # The two senders partition the gross (the apportion sets need it, daily and tight). An invariant guard, not a data
    # check: the three series are members of one scan, so it holds by construction and fails only if the scan planning
    # changes (a member moved to its own scan, or an allowlist sender with no by series). It cannot catch an unlisted
    # sender, which all three series exclude alike.
    - { id: gross_by_sender, type: sum, total: [ flow_usd.yearn_gross ], parts: [ flow_usd.yearn_gross_fees, flow_usd.yearn_gross_incentives ], tolerance_pct: 0.000001 }
  volume: [ flow_usd.yearn_gross ]
