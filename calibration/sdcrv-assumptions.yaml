# sdCRV calibrated assumptions: the "central" package with the 91-day window, chosen by the user on 2026-10-09 ("Central and
# 91 for both") after the same three packages as yCRV were priced under the 28-, 91-, 182- and 357-day on-chain windows.
# Anchors: spot 0.1920 USD (CRV about 0.36), 119.0M sdCRV, 106.9M in the gauge (0.898). Cash to gauge stakers over 91 days,
# a year: 2.47M USD (crvUSD fees 0.66M, CRV 0.22M, vote incentives paid in sdCRV 1.60M), 12.9 percent at spot. Capture is
# each flow's 91-day share of the summed run rate (0.265 / 0.089 / 0.646). Bribes are 65 percent of the cash and fell from
# about 300-370k USD a month in Oct-Jan to 110-175k in Jun-Sep with the CRV price, so growth here is the bribe path, as for
# yCRV: base -11 percent in year one, -5 percent long run, discount 20 percent, 8x (yCRV's central package).
# This set's 12m expected target was 0.118 USD (bear 0.049 / base 0.104 / bull 0.213), 39 percent under spot; staked total
# return -27 percent. The market price needs about +20 percent year-one growth (yCRV: +19). The 357-day window was not used:
# it would carry last winter's bribe levels. The constructive bull (0.42-0.67) would exceed CRV's price; the ceiling rule
# is parked by the user and central stays under it.
