# yCRV calibrated assumptions: the "central" package the user chose on 2026-10-09 after a sensitivity sweep and three priced
# packages (conservative / central / constructive) under the 91-, 182- and 357-day on-chain payout windows; the user kept 91
# days (as CRV). Anchors at the time: spot 0.1834 USD (CRV 0.35), yCRV supply 71.96M, 63.33M staked in YearnBoostedStaker
# (0.880), crvUSD to stakers 1.52M USD a year (91 days; 182 days 1.74M, 357 days 2.38M: monthly payouts fell from about
# 220k USD in Nov-Mar to about 128k in Jul-Sep with the CRV price), a 13.1 percent cash yield on staked yCRV at spot. About 74
# percent of the cash is CRV vote incentives sold for crvUSD, so growth here is the bribe path: base decays with CRV
# emissions (-11 percent in year one, -5 percent long run), bear harder, bull a mild recovery. Discount 20 percent and the
# 25/50/25 weights follow CRV's central package; 8x holder-flow multiple.
# This set's 12m expected target was 0.122 USD (bear 0.051 / base 0.108 / bull 0.221, dispersion 0.82), 34 percent under
