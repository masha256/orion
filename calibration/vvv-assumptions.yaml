# VVV assumption set, calibrated by the user on 2026-09-19.
# Import with:  orion model assumptions import vvv calibration/vvv-assumptions.yaml --rationale "..."
# Git history is the version record for this file; the database keeps every imported version too.
#
# The four views that drive the target (chosen by the user):
#   growth    Momentum: Venice revenue 12 months out at $125M / $200M / $300M (from about $100M).
#   multiple  Expansion: today's FDV is about 8.4x forward revenue under base growth; base assumes a rerating to 11x.
#   capture   Deflation push: bear = discretionary buybacks stop; base = policy drifts up; bull = Venice exceeds
#             its stated net-deflation goal (about 27% capture offsets 2.0M VVV/yr of emissions at $200M revenue).
#   regime    Market-wide mood only, independent of Venice.
# Everything else moves the 12m target by well under $1 across its plausible range and is left at defaults.
